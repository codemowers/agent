apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: agent
build:
  platforms:
    - linux/amd64
  local:
    push: true
  tagPolicy:
    inputDigest: {}
  artifacts:
    - image: agent
      context: .
      docker:
        target: runner
    - image: agent-controller
      context: .
      docker:
        target: controller
    - image: agent-webhook
      context: webhook
      docker: {}
    - image: agent-operator
      context: operator
      docker: {}
manifests:
  helm:
    flags:
      global:
        - --kube-version=1.36.3
    releases:
      - name: agent
        chartPath: chart
        skipBuildDependencies: true
        setValues:
          host: controller
          "allowedGroups[0]": github.com:codemowers:admins
          env.AGENT_SHARING_MODE: public
          imageRegistry: ""
        setValueTemplates:
          env.AGENT_KUBE_CONTEXT: "{{.AGENT_KUBE_CONTEXT}}"
          "webhook.agents[0]": codemowers-agent

deploy:
  kubectl:
    flags:
      # Keep labeled chart resources when Skaffold cleans up.
      delete:
        - --selector=skaffold.dev/keep!=true

profiles:
  - name: cluster
    patches:
      - op: add
        path: /manifests/helm/releases/0/setValues/bootstrapRbac
        value: "false"
    build:
      platforms:
        - linux/amd64
      tagPolicy:
        inputDigest: {}
      cluster:
        namespace: codemowers-agent-system
        dockerConfig:
          secretName: zot-registry-cluster-push-kaniko
      artifacts:
        - image: agent
          context: .
          kaniko:
            target: runner
        - image: agent-controller
          context: .
          kaniko:
            target: controller
        - image: agent-webhook
          context: webhook
          kaniko: {}
        - image: agent-operator
          context: operator
          kaniko: {}
  - name: dev-test
    activation:
      - kubeContext: dev-test
    patches:
      - op: remove
        path: /manifests/helm/releases/0/setValues/allowedGroups[0]
      - op: add
        path: /manifests/helm/releases/0/setValues/allowedUsers[0]
        value: laurivosandi
      - op: replace
        path: /manifests/helm/releases/0/setValueTemplates/env.AGENT_KUBE_CONTEXT
        value: dev-test/codemowers-agent-system
