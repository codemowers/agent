apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: agent-operator
build:
  platforms:
    - linux/amd64
  cluster:
    namespace: codemowers-agent-system
    dockerConfig:
      secretName: zot-registry-cluster-push-kaniko
  tagPolicy:
    inputDigest: {}
  artifacts:
    - image: agent-worker
      context: .
      kaniko:
        target: runner
    - image: agent-webhook
      context: webhook
      kaniko: {}
    - image: agent-operator
      context: operator
      kaniko: {}
    - image: agent-devices
      context: operator
      kaniko:
        dockerfile: devicebridge/Dockerfile
    - image: agent-mailbox
      context: .
      kaniko:
        target: mailbox
manifests:
  helm:
    flags:
      global:
        - --kube-version=1.36.3
    releases:
      - name: agent-operator
        chartPath: chart
        setValues:
          operator.host: dashboard
          webhook.host: webhook
          rabbitmq.name: agent-events
          imageRepository: ""
        setValueTemplates:
          operator.apiResource: "{{.AGENT_OPERATOR_API_RESOURCE}}"
          webhook.publicOrigin: "{{.AGENT_WEBHOOK_PUBLIC_ORIGIN}}"
          webhook.trustedProxies: "{{.AGENT_WEBHOOK_TRUSTED_PROXIES}}"

# The operator reads worker and Mailbox images from ConfigMaps.
resourceSelector:
  allow:
    - groupKind: ConfigMap
      image: [.data.image]

deploy:
  kubectl:
    flags:
      # Keep labeled chart resources when Skaffold cleans up.
      delete:
        - --selector=skaffold.dev/keep!=true
