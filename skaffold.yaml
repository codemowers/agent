apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: agent
build:
  platforms:
    - linux/amd64
  cluster:
    namespace: codemowers-agent-system
    dockerConfig:
      secretName: zot-registry-cluster-push-kaniko
  tagPolicy:
    inputDigest: {}
  artifacts:
    - image: agent
      context: .
      kaniko:
        target: runner
    - image: agent-controller
      context: .
      kaniko:
        target: controller
    - image: agent-webhook
      context: webhook
      kaniko: {}
    - image: agent-operator
      context: operator
      kaniko: {}
manifests:
  helm:
    flags:
      global:
        - --kube-version=1.36.3
    releases:
      - name: agent
        chartPath: chart
        skipBuildDependencies: true
        setValues:
          host: controller
          env.AGENT_SHARING_MODE: public
          imageRegistry: ""
        setValueTemplates:
          image: "{{.IMAGE_FULLY_QUALIFIED_agent_controller}}"
          workerImage: "{{.IMAGE_FULLY_QUALIFIED_agent}}"
          webhook.image: "{{.IMAGE_FULLY_QUALIFIED_agent_webhook}}"
          operator.image: "{{.IMAGE_FULLY_QUALIFIED_agent_operator}}"
          env.AGENT_KUBE_CONTEXT: "{{.AGENT_KUBE_CONTEXT}}"
          apiResource: "{{.AGENT_API_RESOURCE}}"
          operator.apiResource: "{{.AGENT_OPERATOR_API_RESOURCE}}"

deploy:
  kubectl:
    flags:
      # Keep labeled chart resources when Skaffold cleans up.
      delete:
        - --selector=skaffold.dev/keep!=true

profiles:
  - name: dev-test
    activation:
      - kubeContext: dev-test
    patches:
      - op: replace
        path: /manifests/helm/releases/0/setValueTemplates/env.AGENT_KUBE_CONTEXT
        value: dev-test/codemowers-agent-system
