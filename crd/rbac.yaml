---
# ClusterRole: operator reconciles Agent and Task CRs cluster-wide,
# manages worker Pods/PVCs, and reads Secrets by name (not list/watch).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-operator
  labels:
    codemowers.cloud/component: agent-operator
rules:
  - apiGroups: [agents.codemowers.cloud]
    resources: [agents, tasks]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [agents.codemowers.cloud]
    resources: [agents/status, tasks/status]
    verbs: [get, update, patch]
  - apiGroups: ['']
    resources: [pods, persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ['']
    resources: [pods/log]
    verbs: [get]
  # Get named secrets only — list/watch is deliberately absent
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get]
  - apiGroups: ['']
    resources: [serviceaccounts]
    verbs: [get]
  - apiGroups: [rabbitmq.com]
    resources: [rabbitmqclusters]
    verbs: [get, list, watch]
  # Remove only the operator-owned RoleBindings previously generated from spec.access.
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [get, delete]
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
---
# ClusterRole: webhook handler only needs to publish to RabbitMQ.
# No Kubernetes API access; secrets come from its own pod's mounted volume.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-webhook
  labels:
    codemowers.cloud/component: agent-webhook
rules: []
---
# Role: grant a worker namespace access to create/update/delete
# Agent and Task CRs within that namespace (for admin kubectl users).
# Bind this to the human admin group in each worker namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-namespace-admin
  namespace: REPLACE_WITH_WORKER_NAMESPACE
  labels:
    codemowers.cloud/component: agent-namespace-admin
rules:
  - apiGroups: [agents.codemowers.cloud]
    resources: [agents, tasks]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [agents.codemowers.cloud]
    resources: [agents/status, tasks/status]
    verbs: [get]
  # Allow managing the allowed secret prefixes only
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch]
---
# RoleBinding template: bind the operator SA to manage CRs in a worker namespace.
# Apply one of these per worker namespace. Replace NAMESPACE accordingly.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-operator-manage-namespace
  namespace: REPLACE_WITH_WORKER_NAMESPACE
subjects:
  - kind: ServiceAccount
    name: agent-operator
    namespace: agent-system
roleRef:
  kind: ClusterRole
  name: agent-operator
  apiGroup: rbac.authorization.k8s.io
---
# RoleBinding template: allow the messaging-topology-operator SA to manage
# RabbitMQ topology objects (Queue, Exchange, Binding, User, Permission, Vhost)
# in the agent-messaging namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-rabbitmq-topology-operator
  namespace: agent-messaging
subjects:
  - kind: ServiceAccount
    name: messaging-topology-operator
    namespace: rabbitmq-system
roleRef:
  kind: ClusterRole
  name: rabbitmq-topology-operator
  apiGroup: rbac.authorization.k8s.io
