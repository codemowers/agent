---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.0
  name: tasks.agents.codemowers.cloud
spec:
  group: agents.codemowers.cloud
  names:
    kind: Task
    listKind: TaskList
    plural: tasks
    shortNames:
    - task
    singular: task
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.reason
      name: Reason
      type: string
    - jsonPath: .status.workerPodName
      name: Worker
      type: string
    - jsonPath: .spec.suspend
      name: Suspended
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Task tracks one unit of work. It is owned by an Agent CR. Deleting a Task
          cascades to its worker Pod and workspace PVC via ownerReferences.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              completionPolicy:
                description: CompletionPolicy defines when the controller considers
                  this Task done.
                properties:
                  milestone:
                    enum:
                    - PullRequestCreated
                    - VerifiedChecks
                    - Approved
                    - Merged
                    type: string
                  requiredChecks:
                    items:
                      type: string
                    type: array
                required:
                - milestone
                type: object
              externalReferences:
                description: ExternalReferences maps this Task to external anchors
                  for event routing.
                items:
                  properties:
                    channelId:
                      type: string
                    id:
                      description: ID is the issue number, PR number, Slack thread_ts
                        or Alertmanager fingerprint.
                      type: string
                    kind:
                      enum:
                      - issue
                      - pull_request
                      - thread
                      - alert
                      type: string
                    repositoryName:
                      type: string
                    repositoryOwner:
                      type: string
                    serverURL:
                      type: string
                    source:
                      enum:
                      - github
                      - gitea
                      - slack
                      - alertmanager
                      type: string
                    workspaceId:
                      type: string
                  required:
                  - id
                  - kind
                  - source
                  type: object
                type: array
              model:
                description: Model overrides the Agent's default model for this Task.
                properties:
                  backend:
                    description: Backend is claude or codex.
                    enum:
                    - claude
                    - codex
                    type: string
                  credentialSecretRef:
                    description: CredentialSecretRef is the secret name (agent-cred-*
                      prefix) holding the API key.
                    type: string
                required:
                - backend
                - credentialSecretRef
                type: object
              objective:
                description: Objective is the human-readable goal for the worker.
                type: string
              suspend:
                default: false
                description: |-
                  Suspend stops the current worker and prevents a new one from starting.
                  Analogous to CronJob suspend.
                type: boolean
            required:
            - objective
            type: object
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              outputs:
                additionalProperties:
                  type: string
                type: object
              phase:
                description: TaskPhase describes the current lifecycle state of the
                  Task.
                enum:
                - Pending
                - Running
                - Waiting
                - Paused
                - Completed
                - Failed
                type: string
              progress:
                properties:
                  summary:
                    type: string
                  updatedAt:
                    format: date-time
                    type: string
                type: object
              queueMessageId:
                type: string
              reason:
                type: string
              sessionEpoch:
                type: integer
              workerPodName:
                type: string
              workerPodUID:
                type: string
              workspacePVCs:
                additionalProperties:
                  type: string
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
