apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: taskcreationpolicies.codemowers.cloud
spec:
  group: codemowers.cloud
  scope: Namespaced
  names:
    plural: taskcreationpolicies
    singular: taskcreationpolicy
    kind: TaskCreationPolicy
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - agentRef
                - receiverRef
                - keyPrefix
                - check
              properties:
                agentRef:
                  type: string
                receiverRef:
                  type: string
                keyPrefix:
                  type: array
                  minItems: 1
                  maxItems: 8
                  items:
                    type: string
                    minLength: 1
                    maxLength: 256
                check:
                  type: string
                  enum:
                    - currentForgeAssignment
