---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: agents.agents.codemowers.cloud
spec:
  group: agents.codemowers.cloud
  names:
    kind: Agent
    listKind: AgentList
    plural: agents
    shortNames:
    - ag
    singular: agent
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.model.backend
      name: Backend
      type: string
    - jsonPath: .status.taskCount
      name: Tasks
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Agent defines a privilege domain: which credentials and MCP endpoints worker
          pods may access. Task CRs are owned by an Agent via ownerReferences; deleting
          the Agent cascades to all its Tasks and their worker Pods and PVCs.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              podSpec:
                description: |-
                  PodSpec is the pod template spec for worker pods, mirroring corev1.PodSpec.
                  Declare containers, initContainers, volumes, serviceAccountName, nodeSelector,
                  tolerations, affinity and any other pod-level fields here. The operator:
                    - deep-copies this and appends workspace PVC and credential volumes
                    - prepends TASK_NAME, TASK_NAMESPACE and AGENT_NAME to every container's env
                    - enforces restartPolicy=Never and hostUsers=false
                    - defaults serviceAccountName to "agent-worker" when empty
                type: object
                x-kubernetes-preserve-unknown-fields: true
              volumeClaimTemplates:
                description: |-
                  VolumeClaimTemplates mirrors StatefulSet's volumeClaimTemplates. The operator stamps
                  one PVC per Task per entry using metadata.name as the volume and PVC name suffix.
                  Mount them from worker.volumeMounts by name.
                items:
                  description: PersistentVolumeClaim template entry. Only metadata.name and spec are used.
                  properties:
                    metadata:
                      properties:
                        name:
                          type: string
                      required:
                      - name
                      type: object
                    spec:
                      description: PersistentVolumeClaimSpec for the stamped PVC.
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                  required:
                  - metadata
                  - spec
                  type: object
                type: array
              volumes:
                description: |-
                  Volumes are pod-level volume sources added to each worker pod.
                  Mirrors PodSpec.volumes. Reference from container.volumeMounts by name.
                items:
                  description: Volume entry; mirrors corev1.Volume (name + one source field).
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                type: array
              access:
                description: |-
                  Access declares which OIDC groups and subjects may manage this Agent and its Tasks.
                  The Agent reconciler creates a namespaced RoleBinding (agent-access-<name>) for
                  these principals against the cluster-wide agent-manager ClusterRole.
                properties:
                  groups:
                    description: |-
                      Groups is a list of OIDC group names.
                      Format: <provider>:<org>:<team> (e.g. "github.com:codemowers:admins").
                    items:
                      type: string
                    type: array
                  subjects:
                    description: Subjects is a list of individual OIDC subjects, typically email addresses.
                    items:
                      type: string
                    type: array
                type: object
              model:
                description: Model selects the AI backend and its credential secret.
                properties:
                  backend:
                    description: Backend is claude or codex.
                    enum:
                    - claude
                    - codex
                    type: string
                  credentialSecretRef:
                    description: CredentialSecretRef is the secret name (agent-cred-*
                      prefix) holding the API key.
                    type: string
                required:
                - backend
                - credentialSecretRef
                type: object
              credentialRefs:
                description: |-
                  CredentialRefs is the exhaustive allowlist of agent-cred-* secrets that
                  worker pods may mount. Admission policy enforces this list.
                items:
                  type: string
                type: array
              gitProviders:
                description: GitProviders lists git server credentials available to workers.
                items:
                  properties:
                    credentialSecretRef:
                      description: CredentialSecretRef names a secret (agent-cred-*
                        prefix) with a `token` key.
                      type: string
                    serverURL:
                      type: string
                    type:
                      enum:
                      - github
                      - gitea
                      type: string
                  required:
                  - credentialSecretRef
                  - serverURL
                  - type
                  type: object
                type: array
              slackWorkspaces:
                description: |-
                  SlackWorkspaces lists Slack workspaces the controller can read/write.
                  Credentials are controller-only (agent-ctrl-* prefix).
                items:
                  properties:
                    botTokenSecretRef:
                      description: BotTokenSecretRef names an agent-ctrl-* secret
                        with the bot OAuth token.
                      type: string
                    signingSecretRef:
                      description: SigningSecretRef names an agent-hook-* secret for
                        request verification.
                      type: string
                    workspaceId:
                      type: string
                  required:
                  - botTokenSecretRef
                  - signingSecretRef
                  - workspaceId
                  type: object
                type: array
              webhookSecretRef:
                description: |-
                  WebhookSecretRef is the secret (agent-hook-* prefix) for GitHub/Gitea HMAC.
                  Read by the webhook handler, not mounted in worker pods.
                type: string
              mcpEndpoints:
                description: MCPEndpoints lists MCP servers available to workers.
                items:
                  properties:
                    siteURL:
                      type: string
                    tokenFile:
                      type: string
                    url:
                      type: string
                  required:
                  - url
                  type: object
                type: array
            required:
            - podSpec
            - model
            type: object
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              taskCount:
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
