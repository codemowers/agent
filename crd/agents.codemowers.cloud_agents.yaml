---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: agents.agents.codemowers.cloud
spec:
  group: agents.codemowers.cloud
  names:
    kind: Agent
    listKind: AgentList
    plural: agents
    shortNames:
    - ag
    singular: agent
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.model.backend
      name: Backend
      type: string
    - jsonPath: .status.taskCount
      name: Tasks
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Agent defines a privilege domain: which credentials and MCP endpoints worker
          pods may access. Task CRs are owned by an Agent via ownerReferences; deleting
          the Agent cascades to all its Tasks and their worker Pods and PVCs.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              worker:
                description: Worker describes the worker container. Maps to a PodSpec container entry.
                properties:
                  image:
                    description: Image is the OCI image for the worker container.
                    type: string
                  securityContext:
                    description: |-
                      SecurityContext is the container security context applied to worker pods.
                      Mirrors the Kubernetes SecurityContext fields: runAsUser, runAsNonRoot,
                      readOnlyRootFilesystem, allowPrivilegeEscalation, capabilities, etc.
                      If absent the operator applies a safe default: allowPrivilegeEscalation=false.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  env:
                    description: |-
                      Env is a list of additional environment variables for the worker container.
                      Appended after operator-managed vars (PATH, TASK_NAME, TASK_NAMESPACE, AGENT_NAME).
                      Use valueFrom to reference ConfigMap or Secret keys.
                    items:
                      description: EnvVar represents an environment variable present in a Container.
                      properties:
                        name:
                          description: Name of the environment variable.
                          type: string
                        value:
                          description: Literal string value. Takes precedence over valueFrom when both are set.
                          type: string
                        valueFrom:
                          description: Source for the environment variable's value.
                          properties:
                            configMapKeyRef:
                              description: Selects a key of a ConfigMap.
                              properties:
                                key:
                                  type: string
                                name:
                                  type: string
                                optional:
                                  type: boolean
                              required:
                              - key
                              - name
                              type: object
                            fieldRef:
                              description: Selects a field of the pod.
                              properties:
                                apiVersion:
                                  type: string
                                fieldPath:
                                  type: string
                              required:
                              - fieldPath
                              type: object
                            resourceFieldRef:
                              description: Selects a resource of the container.
                              properties:
                                containerName:
                                  type: string
                                divisor:
                                  type: string
                                resource:
                                  type: string
                              required:
                              - resource
                              type: object
                            secretKeyRef:
                              description: Selects a key of a Secret.
                              properties:
                                key:
                                  type: string
                                name:
                                  type: string
                                optional:
                                  type: boolean
                              required:
                              - key
                              - name
                              type: object
                          type: object
                      required:
                      - name
                      type: object
                    type: array
                  envFrom:
                    description: EnvFrom injects all keys from a ConfigMap or Secret as environment variables.
                    items:
                      description: EnvFromSource represents the source of a set of ConfigMaps or Secrets.
                      properties:
                        configMapRef:
                          description: Selects a ConfigMap to populate the environment variables.
                          properties:
                            name:
                              type: string
                            optional:
                              type: boolean
                          required:
                          - name
                          type: object
                        prefix:
                          description: An optional identifier to prepend to each key.
                          type: string
                        secretRef:
                          description: Selects a Secret to populate the environment variables.
                          properties:
                            name:
                              type: string
                            optional:
                              type: boolean
                          required:
                          - name
                          type: object
                      type: object
                    type: array
                required:
                - image
                type: object
              workspaceSize:
                description: |-
                  WorkspaceSize is the PVC storage request for the task workspace (e.g. "10Gi").
                  Empty or absent means no PVC is created; tasks run without persistent storage.
                type: string
              access:
                description: |-
                  Access declares which OIDC groups and subjects may manage this Agent and its Tasks.
                  The Agent reconciler creates a namespaced RoleBinding (agent-access-<name>) for
                  these principals against the cluster-wide agent-manager ClusterRole.
                properties:
                  groups:
                    description: |-
                      Groups is a list of OIDC group names.
                      Format: <provider>:<org>:<team> (e.g. "github.com:codemowers:admins").
                    items:
                      type: string
                    type: array
                  subjects:
                    description: Subjects is a list of individual OIDC subjects, typically email addresses.
                    items:
                      type: string
                    type: array
                type: object
              model:
                description: Model selects the AI backend and its credential secret.
                properties:
                  backend:
                    description: Backend is claude or codex.
                    enum:
                    - claude
                    - codex
                    type: string
                  credentialSecretRef:
                    description: CredentialSecretRef is the secret name (agent-cred-*
                      prefix) holding the API key.
                    type: string
                required:
                - backend
                - credentialSecretRef
                type: object
              credentialRefs:
                description: |-
                  CredentialRefs is the exhaustive allowlist of agent-cred-* secrets that
                  worker pods may mount. Admission policy enforces this list.
                items:
                  type: string
                type: array
              gitProviders:
                description: GitProviders lists git server credentials available to workers.
                items:
                  properties:
                    credentialSecretRef:
                      description: CredentialSecretRef names a secret (agent-cred-*
                        prefix) with a `token` key.
                      type: string
                    serverURL:
                      type: string
                    type:
                      enum:
                      - github
                      - gitea
                      type: string
                  required:
                  - credentialSecretRef
                  - serverURL
                  - type
                  type: object
                type: array
              slackWorkspaces:
                description: |-
                  SlackWorkspaces lists Slack workspaces the controller can read/write.
                  Credentials are controller-only (agent-ctrl-* prefix).
                items:
                  properties:
                    botTokenSecretRef:
                      description: BotTokenSecretRef names an agent-ctrl-* secret
                        with the bot OAuth token.
                      type: string
                    signingSecretRef:
                      description: SigningSecretRef names an agent-hook-* secret for
                        request verification.
                      type: string
                    workspaceId:
                      type: string
                  required:
                  - botTokenSecretRef
                  - signingSecretRef
                  - workspaceId
                  type: object
                type: array
              webhookSecretRef:
                description: |-
                  WebhookSecretRef is the secret (agent-hook-* prefix) for GitHub/Gitea HMAC.
                  Read by the webhook handler, not mounted in worker pods.
                type: string
              mcpEndpoints:
                description: MCPEndpoints lists MCP servers available to workers.
                items:
                  properties:
                    siteURL:
                      type: string
                    tokenFile:
                      type: string
                    url:
                      type: string
                  required:
                  - url
                  type: object
                type: array
              workerServiceAccountName:
                description: WorkerServiceAccountName is the SA used by worker pods.
                  Defaults to agent-worker.
                type: string
              toolImages:
                description: |-
                  ToolImages are OCI image volumes mounted into worker pods for additional tooling
                  (e.g. kubectl, helm, go). PATH is prepended with each image's bin path in order.
                  PATH: <tool1/bin>:<tool2/bin>:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
                items:
                  description: ToolImage describes an OCI image volume mounted as
                    a toolchain in worker pods.
                  properties:
                    binPath:
                      description: BinPath is the subdirectory of MountPath prepended
                        to PATH. Defaults to "bin".
                      type: string
                    image:
                      description: Image is the OCI image reference.
                      type: string
                    mountPath:
                      description: 'MountPath is the directory where the image filesystem
                        root is mounted. Convention: /opt/tools/<name>'
                      type: string
                    name:
                      description: Name is used as the volume name; must be unique
                        within the Agent.
                      type: string
                  required:
                  - image
                  - mountPath
                  - name
                  type: object
                type: array
            required:
            - model
            - worker
            type: object
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              taskCount:
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
