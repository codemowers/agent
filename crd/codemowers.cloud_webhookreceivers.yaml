apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: webhookreceivers.codemowers.cloud
spec:
  group: codemowers.cloud
  scope: Namespaced
  names:
    plural: webhookreceivers
    singular: webhookreceiver
    kind: WebhookReceiver
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - sourceRef
                - agentRef
                - routing
              properties:
                sourceRef:
                  type: object
                  required:
                    - kind
                    - name
                  properties:
                    kind:
                      type: string
                      enum:
                        - ClusterWebhookReceiver
                    name:
                      type: string
                agentRef:
                  type: string
                match:
                  type: object
                  additionalProperties:
                    type: string
                verificationKeyRef:
                  type: object
                  required:
                    - name
                    - key
                  properties:
                    name:
                      type: string
                      enum:
                        - agent-operator-webhook-keys
                    key:
                      type: string
                routing:
                  type: object
                  properties:
                    keyCEL:
                      type: string
                      maxLength: 8192
                    existingTask:
                      type: string
                      enum:
                        - exactKey
                    otherwise:
                      type: object
                      properties:
                        taskRef:
                          type: string
                    coalesceFor:
                      type: string
