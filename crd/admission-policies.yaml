---
# Enforce that pods created by the agent-worker SA only mount secrets
# that match the agent-cred-* or agent-push prefixes.
# This prevents a prompt-injected worker from accessing controller secrets
# (agent-ctrl-*, agent-hook-*) even if they're in the same namespace.
#
# Applied at WORKLOAD level (Deployment/StatefulSet spec.template) so that
# operator-managed pods (Dragonfly via StatefulSet, CNPG direct pods) are
# also covered through their creator identity, not the pod creator identity.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: agent-worker-secret-confinement
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      # Catch direct Pod creation
      - apiGroups: ['']
        apiVersions: ['v1']
        resources: ['pods']
        operations: [CREATE]
      # Catch workload objects whose spec.template is the pod template
      - apiGroups: ['apps']
        apiVersions: ['v1']
        resources: ['deployments', 'statefulsets', 'daemonsets']
        operations: [CREATE, UPDATE]
  variables:
    - name: isWorkerSA
      expression: >
        request.userInfo.username.startsWith("system:serviceaccount:") &&
        request.userInfo.username.endsWith(":agent-worker")
    - name: podVolumes
      expression: >
        (object.kind == "Pod")
          ? object.spec.volumes
          : object.spec.template.spec.volumes
  validations:
    - expression: >
        !variables.isWorkerSA ||
        variables.podVolumes.all(v,
          !has(v.secret) ||
          v.secret.secretName.startsWith("agent-cred-") ||
          v.secret.secretName == "agent-push"
        )
      message: >
        Pods created by the agent-worker service account may only mount secrets
        with the agent-cred-* prefix or the agent-push secret.
      reason: Forbidden
---
# Bind the policy to all namespaces; namespaceSelector can be narrowed
# to only namespaces that host agent workers.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: agent-worker-secret-confinement-binding
spec:
  policyName: agent-worker-secret-confinement
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        codemowers.cloud/agent-namespace: 'true'
---
# Enforce that pods created by the agent-controller SA only mount
# agent-cred-*, agent-ctrl-* and agent-push secrets. Hook secrets
# (agent-hook-*) are only needed by the webhook handler, not the controller pod.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: agent-controller-secret-confinement
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: ['v1']
        resources: ['pods']
        operations: [CREATE]
      - apiGroups: ['apps']
        apiVersions: ['v1']
        resources: ['deployments', 'statefulsets', 'daemonsets']
        operations: [CREATE, UPDATE]
  variables:
    - name: isControllerSA
      expression: >
        request.userInfo.username == "system:serviceaccount:agent-system:agent-controller"
    - name: podVolumes
      expression: >
        (object.kind == "Pod")
          ? object.spec.volumes
          : object.spec.template.spec.volumes
  validations:
    - expression: >
        !variables.isControllerSA ||
        variables.podVolumes.all(v,
          !has(v.secret) ||
          v.secret.secretName.startsWith("agent-cred-") ||
          v.secret.secretName.startsWith("agent-ctrl-") ||
          v.secret.secretName == "agent-push"
        )
      message: >
        Pods created by the agent-controller service account may only mount secrets
        with the agent-cred-*, agent-ctrl-* prefixes or the agent-push secret.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: agent-controller-secret-confinement-binding
spec:
  policyName: agent-controller-secret-confinement
  validationActions: [Deny]
  matchResources:
    namespaceSelector: {}
