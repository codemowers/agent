apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: webhookprotocols.codemowers.cloud
spec:
  group: codemowers.cloud
  scope: Cluster
  names:
    plural: webhookprotocols
    singular: webhookprotocol
    kind: WebhookProtocol
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - event
              properties:
                signature:
                  description: How the sender signs requests. The key comes from the receiver.
                  type: object
                  required:
                    - algorithm
                    - header
                    - encoding
                  properties:
                    algorithm:
                      description: hmacSha256 with the receiver's secret, or ed25519 with its public key.
                      type: string
                      enum:
                        - hmacSha256
                        - ed25519
                    keyEncoding:
                      description: Encoding of the receiver's hmacSha256 secret.
                      type: string
                      enum:
                        - utf8
                        - hex
                    header:
                      type: string
                    prefix:
                      type: string
                    encoding:
                      type: string
                      enum:
                        - hex
                        - base64
                    signedBytesCEL:
                      type: string
                      maxLength: 4096
                    freshness:
                      type: object
                      required:
                        - timestampHeader
                        - maxSkew
                      properties:
                        timestampHeader:
                          type: string
                        maxSkew:
                          type: string
                event:
                  type: object
                  required:
                    - eventsCEL
                  properties:
                    requiredHeaders:
                      type: array
                      maxItems: 32
                      items:
                        type: string
                    acceptCEL:
                      type: string
                      maxLength: 8192
                    allowedKeyPrefixes:
                      description: Canonical key URI prefixes this protocol's events
                        may carry, matched at a path boundary. Events with other keys
                        are rejected; without prefixes, events carry no key.
                      type: array
                      maxItems: 16
                      x-kubernetes-list-type: set
                      items:
                        type: string
                        minLength: 1
                        maxLength: 1024
                    eventsCEL:
                      type: string
                      maxLength: 16384
                response:
                  type: object
                  properties:
                    status:
                      type: integer
                      minimum: 200
                      maximum: 299
                    defaultStatus:
                      type: integer
                      minimum: 200
                      maximum: 299
                    rules:
                      type: array
                      maxItems: 8
                      items:
                        type: object
                        required:
                          - whenCEL
                          - status
                        properties:
                          whenCEL:
                            type: string
                            maxLength: 4096
                          status:
                            type: integer
                            minimum: 200
                            maximum: 299
                          contentType:
                            type: string
                          bodyCEL:
                            type: string
                            maxLength: 4096
