apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: webhookreceivers.codemowers.ai
spec:
  group: codemowers.ai
  scope: Namespaced
  names:
    plural: webhookreceivers
    singular: webhookreceiver
    kind: WebhookReceiver
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Protocol
          type: string
          jsonPath: .spec.protocolRef
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - protocolRef
                - senders
              properties:
                protocolRef:
                  description: Cluster-scoped WebhookProtocol name.
                  type: string
                match:
                  description: Settings the protocol's CEL reads as receiver.match, such as serverURL.
                  type: object
                  maxProperties: 16
                  additionalProperties:
                    type: string
                    maxLength: 1024
                senders:
                  description: A request must pass the secret signature, a listed ServiceAccount's
                    token or the Ed25519 signature, and also come from an allowed address when
                    githubMeta or cidrs restrict it.
                  type: object
                  x-kubernetes-validations:
                    - rule: has(self.secretKeyRef) || has(self.serviceAccounts) || has(self.ed25519PublicKey)
                      message: secretKeyRef, serviceAccounts or ed25519PublicKey is required
                    - rule: '!has(self.serviceAccounts) || has(self.audience)'
                      message: serviceAccounts require an audience
                  properties:
                    secretKeyRef:
                      description: Signing key in a Secret of the receiver's namespace.
                      type: object
                      required:
                        - name
                        - key
                      properties:
                        name:
                          type: string
                          maxLength: 253
                        key:
                          type: string
                          maxLength: 253
                          pattern: '^[-._a-zA-Z0-9]+$'
                    githubMeta:
                      description: GitHub or GHES meta API URL; deliveries must also come from its
                        hooks address ranges.
                      type: string
                      maxLength: 1024
                      pattern: '^https://'
                    cidrs:
                      description: Deliveries must also come from one of these client address ranges.
                      type: array
                      maxItems: 64
                      items:
                        type: string
                        maxLength: 64
                    serviceAccounts:
                      description: <namespace>/<name> senders presenting a projected token for audience.
                      type: array
                      maxItems: 16
                      items:
                        type: string
                        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?/[a-z0-9]([-a-z0-9.]*[a-z0-9])?$'
                    audience:
                      type: string
                      maxLength: 253
                    ed25519PublicKey:
                      description: Hex public key for the protocol's signature.
                      type: string
                      pattern: '^[0-9a-fA-F]{64}$'
