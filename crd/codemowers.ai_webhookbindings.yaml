apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: webhookbindings.codemowers.ai
spec:
  group: codemowers.ai
  scope: Namespaced
  names:
    plural: webhookbindings
    singular: webhookbinding
    kind: WebhookBinding
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - receiverRef
                - agentRef
              x-kubernetes-validations:
                - rule: self.receiverRef.kind != 'ClusterWebhookReceiver' || has(self.keyPrefixes)
                  message: bindings to a ClusterWebhookReceiver need keyPrefixes
              properties:
                receiverRef:
                  type: object
                  required:
                    - kind
                    - name
                  properties:
                    kind:
                      type: string
                      enum:
                        - WebhookReceiver
                        - ClusterWebhookReceiver
                    name:
                      type: string
                agentRef:
                  type: string
                keyPrefixes:
                  description: Only events whose key starts with one of these canonical URI
                    prefixes, at a path boundary, reach this binding.
                  type: array
                  minItems: 1
                  maxItems: 64
                  x-kubernetes-list-type: set
                  items:
                    type: string
                    minLength: 1
                    maxLength: 1024
                routing:
                  type: object
                  properties:
                    keyCEL:
                      description: Optional CEL returning the event's canonical key
                        URI, within the protocol's allowedKeyPrefixes.
                      type: string
                      maxLength: 8192
                    otherwise:
                      type: object
                      properties:
                        taskRef:
                          type: string
