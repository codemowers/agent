---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.0
  name: tasks.codemowers.cloud
spec:
  group: codemowers.cloud
  names:
    kind: Task
    listKind: TaskList
    plural: tasks
    shortNames:
    - task
    singular: task
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.reason
      name: Reason
      type: string
    - jsonPath: .status.workerPodName
      name: Worker
      type: string
    - jsonPath: .spec.suspend
      name: Suspended
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Task tracks one unit of work. spec.agentRef selects its Agent; the
          operator adds an ownerReference. Deleting a Task cascades to its worker
          Pod and workspace PVC.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              agentRef:
                description: AgentRef names the Agent in this Task's namespace. The operator adds the corresponding ownerReference and routing label.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: agentRef is immutable
                  rule: self == oldSelf
              completionPolicy:
                description: CompletionPolicy defines when the controller considers
                  this Task done.
                properties:
                  milestone:
                    enum:
                    - PullRequestCreated
                    - VerifiedChecks
                    - Approved
                    - Merged
                    type: string
                  requiredChecks:
                    items:
                      type: string
                    type: array
                required:
                - milestone
                type: object
              externalReferences:
                description: Source links; a forge reference matching an Agent
                  provider selects the initial repository checkout.
                type: array
                items:
                  type: object
                  required: [source, kind, id]
                  properties:
                    source:
                      type: string
                      enum: [github, gitea, slack, alertmanager, imap]
                    kind:
                      type: string
                      enum: [issue, pull_request, thread, alert]
                    id:
                      type: string
                    serverURL:
                      type: string
                    repositoryOwner:
                      type: string
                    repositoryName:
                      type: string
                    workspaceId:
                      type: string
                    channelId:
                      type: string
                    mailboxRef:
                      type: string
                    mailboxUid:
                      type: string
                    folder:
                      type: string
                    imapThreadId:
                      type: string
              routingKeys:
                description: Exact canonical resource URIs scoped to this Task's
                  Agent and namespace.
                items:
                  maxLength: 1024
                  minLength: 1
                  type: string
                maxItems: 32
                type: array
                x-kubernetes-list-type: set
              model:
                description: Model overrides the Agent's default model for this Task.
                properties:
                  backend:
                    description: Backend is claude or codex.
                    enum:
                    - claude
                    - codex
                    type: string
                  credentialKeyRef:
                    pattern: '^[A-Za-z0-9._-]{1,253}$'
                    description: CredentialKeyRef selects an API key in the namespace's
                      agent-operator-provider-tokens Secret.
                    type: string
                  name:
                    description: Name is the provider model identifier. Empty uses the CLI default.
                    type: string
                    maxLength: 200
                required:
                - backend
                - credentialKeyRef
                type: object
              objective:
                description: Objective is the human-readable goal for the worker.
                type: string
              title:
                description: Short display name for the Task; its metadata name remains the stable ID.
                maxLength: 120
                type: string
              idleSeconds:
                description: Worker idle timeout after a completed turn; copied from Agent on Task creation and overridable per Task.
                type: integer
                format: int32
                minimum: 0
                maximum: 86400
              resources:
                description: Worker container requests and limits copied from Agent on Task creation and overridable per Task.
                type: object
                properties:
                  requests:
                    type: object
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      x-kubernetes-int-or-string: true
                  limits:
                    type: object
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      x-kubernetes-int-or-string: true
              disabledMCPs:
                description: |-
                  DisabledMCPs names MCP endpoints left out of the worker's CLI
                  configuration. Changes reach a running worker before its next turn.
                  The agent_operator endpoint cannot be disabled.
                items:
                  maxLength: 64
                  pattern: ^[a-zA-Z0-9_-]+$
                  type: string
                maxItems: 32
                type: array
                x-kubernetes-list-type: set
              suspend:
                default: false
                description: |-
                  Suspend stops the current worker and prevents a new one from starting.
                  Analogous to CronJob suspend.
                type: boolean
            required:
            - agentRef
            - objective
            type: object
          status:
            properties:
              mcpProbe:
                type: object
                required: [requestId, podUid, state, updatedAt]
                properties:
                  requestId: {type: string, maxLength: 160}
                  podUid: {type: string, maxLength: 80}
                  state: {type: string, enum: [pending, complete, failed]}
                  updatedAt: {type: string, format: date-time}
                  checkedAt:
                    description: Time of the last completed check. Endpoints keep that result while a newer check is pending.
                    type: string
                    format: date-time
                  endpoints:
                    type: array
                    maxItems: 32
                    items:
                      type: object
                      required: [name, state]
                      properties:
                        name: {type: string, maxLength: 64}
                        state: {type: string, enum: [available, unavailable]}
                        detail: {type: string, maxLength: 120}
                        serverTitle: {type: string, maxLength: 64}
                        instructions: {type: string, maxLength: 500}
                        tools:
                          type: array
                          maxItems: 64
                          items: {type: string, maxLength: 64}
              externalReferences:
                description: Source links collected after Task creation.
                type: array
                items:
                  type: object
                  required: [source, kind, id]
                  properties:
                    source:
                      type: string
                      enum: [github, gitea, slack, alertmanager, imap]
                    kind:
                      type: string
                      enum: [issue, pull_request, thread, alert]
                    id:
                      type: string
                    serverURL:
                      type: string
                    repositoryOwner:
                      type: string
                    repositoryName:
                      type: string
                    workspaceId:
                      type: string
                    channelId:
                      type: string
                    mailboxRef:
                      type: string
                    mailboxUid:
                      type: string
                    folder:
                      type: string
                    imapThreadId:
                      type: string
              conversation:
                type: array
                maxItems: 64
                items:
                  type: object
                  required:
                  - id
                  - role
                  - content
                  - createdAt
                  properties:
                    id:
                      type: string
                    role:
                      type: string
                      enum: [user, agent, external, system]
                    source:
                      type: string
                    actor:
                      type: string
                    backend:
                      type: string
                      enum: [claude, codex]
                    model:
                      type: string
                      maxLength: 200
                    metrics:
                      type: object
                      properties:
                        durationMs: {type: integer, format: int64, minimum: 0}
                        apiDurationMs: {type: integer, format: int64, minimum: 0}
                        inputTokens: {type: integer, format: int64, minimum: 0}
                        outputTokens: {type: integer, format: int64, minimum: 0}
                        cacheReadTokens: {type: integer, format: int64, minimum: 0}
                        cacheWriteTokens: {type: integer, format: int64, minimum: 0}
                    content:
                      type: string
                      maxLength: 8000
                    url:
                      type: string
                      maxLength: 2048
                      format: uri
                    createdAt:
                      type: string
                      format: date-time
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              outputs:
                additionalProperties:
                  type: string
                type: object
              lastResultAt:
                type: string
                format: date-time
              lastMessageAt:
                type: string
                format: date-time
              lastWorkerExit:
                description: Last terminal worker Pod UID or name already recorded in conversation.
                type: string
              phase:
                description: TaskPhase describes the current lifecycle state of the
                  Task.
                enum:
                - Pending
                - Running
                - Waiting
                - Paused
                - Completed
                - Failed
                type: string
              activity:
                description: Current worker activity reported through Agent MCP and reconciled on Pod exit.
                enum:
                - starting
                - working
                - idle
                - stopped
                type: string
              progress:
                properties:
                  summary:
                    type: string
                  updatedAt:
                    format: date-time
                    type: string
                type: object
              queueMessageId:
                type: string
              reason:
                type: string
              sessionEpoch:
                type: integer
              workerPodName:
                type: string
              queue:
                description: Declared RabbitMQ Task queue, deleted with the Task even after its Agent is gone.
                type: string
              workerPodUID:
                type: string
              workspacePVCs:
                additionalProperties:
                  type: string
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
