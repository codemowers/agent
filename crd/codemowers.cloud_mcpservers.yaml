apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mcpservers.codemowers.cloud
spec:
  group: codemowers.cloud
  scope: Namespaced
  names:
    plural: mcpservers
    singular: mcpserver
    kind: MCPServer
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: URL
          type: string
          jsonPath: .spec.url
        - name: Token
          type: boolean
          jsonPath: .spec.serviceAccountToken
      schema:
        openAPIV3Schema:
          description: Advertises an MCP server to workers of this namespace whose ServiceAccount holds the custom verb use on it; it overrides a ClusterMCPServer of the same name.
          type: object
          required:
            - spec
          x-kubernetes-validations:
            - rule: "self.metadata.name.matches('^[a-z0-9]([a-z0-9-]{0,57}[a-z0-9])?$') && !self.metadata.name.startsWith('mailbox-')"
              message: name must be a DNS label of at most 59 characters not starting with mailbox-
          properties:
            spec:
              type: object
              required:
                - url
              x-kubernetes-validations:
                - rule: "!has(self.serviceAccountToken) || !self.serviceAccountToken || self.url.matches('^https?://[a-z0-9]([-a-z0-9]*[a-z0-9])?[.][a-z0-9]([-a-z0-9]*[a-z0-9])?[.]svc([.]cluster[.]local)?([:/].*)?$')"
                  message: a token needs an in-cluster URL http(s)://<service>.<namespace>.svc[.cluster.local], whose Service is its audience
              properties:
                url:
                  type: string
                  pattern: ^https?://
                  maxLength: 2048
                serviceAccountToken:
                  description: Send a projected ServiceAccount token for the audience <service>.<namespace> of the in-cluster URL.
                  type: boolean
