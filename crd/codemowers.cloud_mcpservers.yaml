apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mcpservers.codemowers.cloud
spec:
  group: codemowers.cloud
  scope: Namespaced
  names:
    plural: mcpservers
    singular: mcpserver
    kind: MCPServer
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: URL
          type: string
          jsonPath: .spec.url
        - name: Audience
          type: string
          jsonPath: .spec.audience
      schema:
        openAPIV3Schema:
          description: Advertises an MCP server to workers of this namespace whose ServiceAccount holds the custom verb use on it; it overrides a ClusterMCPServer of the same name.
          type: object
          required:
            - spec
          x-kubernetes-validations:
            - rule: "self.metadata.name.matches('^[a-z0-9]([a-z0-9-]{0,57}[a-z0-9])?$') && !self.metadata.name.startsWith('mailbox-')"
              message: name must be a DNS label of at most 59 characters not starting with mailbox-
          properties:
            spec:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  pattern: ^https?://
                  maxLength: 2048
                audience:
                  description: Audience of the projected ServiceAccount token workers present. Defaults to <service>.<namespace> for an in-cluster URL http(s)://<service>.<namespace>.svc[.cluster.local]; other URLs get no token without it.
                  type: string
                  maxLength: 2048
