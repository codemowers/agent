apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: webhookbindings.codemowers.cloud
spec:
  group: codemowers.cloud
  scope: Namespaced
  names:
    plural: webhookbindings
    singular: webhookbinding
    kind: WebhookBinding
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - protocolRef
                - agentRef
              properties:
                protocolRef:
                  description: Cluster-scoped WebhookProtocol name.
                  type: string
                agentRef:
                  type: string
                match:
                  type: object
                  additionalProperties:
                    type: string
                verificationKeyRef:
                  type: object
                  required:
                    - name
                    - key
                  properties:
                    name:
                      type: string
                      enum:
                        - agent-operator-webhook-keys
                    key:
                      type: string
                serviceAccounts:
                  description: <namespace>/<name> senders a serviceAccountToken protocol accepts.
                  type: array
                  maxItems: 16
                  items:
                    type: string
                    pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?/[a-z0-9]([-a-z0-9.]*[a-z0-9])?$'
                routing:
                  type: object
                  properties:
                    keyCEL:
                      description: Optional CEL returning the event's canonical key
                        URI, within the protocol's allowedKeyPrefixes.
                      type: string
                      maxLength: 8192
                    otherwise:
                      type: object
                      properties:
                        taskRef:
                          type: string
                    coalesceFor:
                      type: string
