# Operator RBAC — apply once with cluster-admin when chart bootstrapRbac=false.
# Mirrors the operator ClusterRole and binding rendered by the chart. The
# ClusterRoleBinding applies to Agent CRs in every namespace.
#
# Usage:
#   kubectl apply -f deploy/operator-rbac.yaml
---
# Full operator ClusterRole: CRD access, Pod/PVC management, RoleBinding management.
# Named with namespace suffix so multiple installations on one cluster don't collide.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-operator-codemowers-agent-system-operator
rules:
  - apiGroups: [codemowers.cloud]
    resources: [agents, tasks]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [codemowers.cloud]
    resources: [agents/status, tasks/status]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [pods, persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [get, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-operator-codemowers-agent-system-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-operator-codemowers-agent-system-operator
subjects:
  - kind: ServiceAccount
    name: agent-operator
    namespace: codemowers-agent-system
