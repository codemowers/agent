---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: webhookbindings.codemowers.ai
spec:
  group: codemowers.ai
  names:
    kind: WebhookBinding
    listKind: WebhookBindingList
    plural: webhookbindings
    singular: webhookbinding
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: WebhookBinding subscribes an Agent in its namespace to a receiver's
          events.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              agentRef:
                type: string
              keyPrefixes:
                description: |-
                  KeyPrefixes limits the binding to events whose key starts with one of
                  them at a path boundary; required for a ClusterWebhookReceiver.
                items:
                  maxLength: 1024
                  minLength: 1
                  type: string
                maxItems: 64
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              receiverRef:
                properties:
                  kind:
                    description: Kind is WebhookReceiver (same namespace) or ClusterWebhookReceiver.
                    enum:
                    - WebhookReceiver
                    - ClusterWebhookReceiver
                    type: string
                  name:
                    type: string
                required:
                - kind
                - name
                type: object
              routing:
                properties:
                  keyCEL:
                    maxLength: 8192
                    type: string
                  otherwise:
                    properties:
                      taskRef:
                        type: string
                    type: object
                type: object
            required:
            - agentRef
            - receiverRef
            type: object
            x-kubernetes-validations:
            - message: bindings to a ClusterWebhookReceiver need keyPrefixes
              rule: self.receiverRef.kind != 'ClusterWebhookReceiver' || has(self.keyPrefixes)
        required:
        - spec
        type: object
    served: true
    storage: true
