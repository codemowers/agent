---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: feeds.codemowers.ai
spec:
  group: codemowers.ai
  names:
    kind: Feed
    listKind: FeedList
    plural: feeds
    singular: feed
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.url
      name: URL
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.lastPolledAt
      name: Polled
      type: date
    - jsonPath: .status.lastChangedAt
      name: Changed
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Feed is a public RSS, Atom or JSON Feed that the feed crawler polls.
          Its status holds the crawl state and its most recent items, which workers
          read through the feeds MCP.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              interval:
                description: Interval between polls; nil defaults to one hour.
                type: string
              url:
                maxLength: 2048
                pattern: ^https://
                type: string
            required:
            - url
            type: object
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              etag:
                type: string
              items:
                description: |-
                  Items are the most recently seen items, newest first by FirstSeen.
                  Fetched items absent from them are new.
                items:
                  description: FeedItem is a feed entry as the crawler first saw it.
                  properties:
                    firstSeen:
                      description: |-
                        FirstSeen is when the crawler first fetched the item; unlike
                        Published it only moves forward, so it serves as a cursor.
                      format: date-time
                      type: string
                    id:
                      maxLength: 1024
                      type: string
                    link:
                      maxLength: 2048
                      type: string
                    published:
                      format: date-time
                      type: string
                    title:
                      maxLength: 512
                      type: string
                  required:
                  - firstSeen
                  - id
                  type: object
                maxItems: 200
                type: array
              lastChangedAt:
                format: date-time
                type: string
              lastModified:
                type: string
              lastPolledAt:
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
