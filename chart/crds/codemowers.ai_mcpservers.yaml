---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: mcpservers.codemowers.ai
spec:
  group: codemowers.ai
  names:
    kind: MCPServer
    listKind: MCPServerList
    plural: mcpservers
    singular: mcpserver
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.url
      name: URL
      type: string
    - jsonPath: .spec.audience
      name: Audience
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          MCPServer advertises an MCP server to the workers of its namespace that
          hold "use" on it; it overrides a ClusterMCPServer of the same name.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              audience:
                description: |-
                  Audience is the audience of the projected ServiceAccount token workers
                  present, for servers with an audience contract of their own.
                maxLength: 2048
                type: string
              credential:
                description: |-
                  Credential makes each worker present its own bearer token, the
                  MCP_<NAME>_TOKEN key of its Agent's credential Secret, instead of a
                  ServiceAccount token, for servers such as Linear that authorize each
                  call with per-user credentials. Workers without that key leave the
                  server out.
                type: boolean
              url:
                maxLength: 2048
                pattern: ^https?://
                type: string
            required:
            - url
            type: object
            x-kubernetes-validations:
            - message: audience and credential are mutually exclusive
              rule: '!(has(self.audience) && has(self.credential) && self.credential)'
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: name must be a DNS label of at most 59 characters not starting
            with mailbox-
          rule: self.metadata.name.matches('^[a-z0-9]([a-z0-9-]{0,57}[a-z0-9])?$')
            && !self.metadata.name.startsWith('mailbox-')
    served: true
    storage: true
    subresources: {}
