apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: feedbindings.codemowers.ai
spec:
  group: codemowers.ai
  scope: Namespaced
  names:
    plural: feedbindings
    singular: feedbinding
    kind: FeedBinding
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Feed
          type: string
          jsonPath: .spec.feedRef
        - name: Task
          type: string
          jsonPath: .spec.taskRef
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              description: Wakes a Task of this namespace when the Feed has new items.
              type: object
              required:
                - feedRef
                - taskRef
              properties:
                feedRef:
                  type: string
                taskRef:
                  type: string
