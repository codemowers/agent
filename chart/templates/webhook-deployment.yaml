apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-webhook
  annotations:
    kubernetes.io/description: >-
      Validates signatures from GitHub and Alertmanager and
      publishes events with routing keys to RabbitMQ for the operator.
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}-webhook
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-webhook
    spec:
      serviceAccountName: {{ .Release.Name }}-webhook
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webhook
          image: {{ if .Values.imageRegistry }}{{ .Values.imageRegistry }}/{{ end }}{{ .Values.webhook.image }}
          imagePullPolicy: Always
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: AMQP_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.rabbitmq.existingName | default (printf "%s-events" .Release.Name) }}-default-user
                  key: host
            - name: AMQP_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.rabbitmq.existingName | default (printf "%s-events" .Release.Name) }}-default-user
                  key: port
            - name: AMQP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.rabbitmq.existingName | default (printf "%s-events" .Release.Name) }}-default-user
                  key: username
            - name: AMQP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.rabbitmq.existingName | default (printf "%s-events" .Release.Name) }}-default-user
                  key: password
          resources:
            {{- toYaml .Values.webhook.resources | nindent 12 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-webhook
---
{{- if .Values.bootstrapRbac }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-{{ .Release.Namespace }}-webhook
rules:
  - apiGroups: [codemowers.cloud]
    resources: [agents]
    verbs: [list]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-{{ .Release.Namespace }}-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-{{ .Release.Namespace }}-webhook
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-webhook
    namespace: {{ .Release.Namespace }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-webhook
spec:
  selector:
    app: {{ .Release.Name }}-webhook
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-webhook
spec:
  tls:
    - hosts:
        - {{ .Values.webhook.host | default "webhook" }}
  rules:
    - host: {{ .Values.webhook.host | default "webhook" }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-webhook
                port:
                  name: http
