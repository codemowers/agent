apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-webhook
  annotations:
    kubernetes.io/description: >-
      Evaluates WebhookProtocol and WebhookBinding resources,
      verifies requests, and publishes normalized events to RabbitMQ.
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}-webhook
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-webhook
    spec:
      serviceAccountName: {{ .Release.Name }}-webhook
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webhook
          image: {{ if .Values.imageRegistry }}{{ .Values.imageRegistry }}/{{ end }}{{ .Values.webhook.image }}
          imagePullPolicy: Always
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Logs in with the projected token below; RabbitMQ verifies the
            # user_id stamped on each event against the token subject.
            - name: AMQP_URL
              value: amqp://{{ include "agent.rabbitmq" . }}.{{ .Release.Namespace }}.svc:5672/%2F
            - name: AMQP_USER_ID
              value: system:serviceaccount:{{ .Release.Namespace }}:{{ .Release.Name }}-webhook
            - name: AGENT_RABBITMQ_TOKEN_FILE
              value: /var/run/agent-rabbitmq/token
          volumeMounts:
            - name: agent-rabbitmq-token
              mountPath: /var/run/agent-rabbitmq
              readOnly: true
          resources:
            {{- toYaml .Values.webhook.resources | nindent 12 }}
      volumes:
        - name: agent-rabbitmq-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: agent-rabbitmq-publisher
                  expirationSeconds: 3600
                  path: token
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-webhook
---
{{- if .Values.bootstrapRbac }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-{{ .Release.Namespace }}-webhook
rules:
  - apiGroups: [codemowers.cloud]
    resources:
      - webhookbindings
    verbs:
      - list
      - get
  - apiGroups: [codemowers.cloud]
    resources:
      - webhookprotocols
    verbs:
      - get
  - apiGroups: [""]
    resources:
      - secrets
    resourceNames:
      - agent-operator-webhook-keys
    verbs:
      - get
  # Authenticates senders of serviceAccountToken protocols.
  - apiGroups: [authentication.k8s.io]
    resources:
      - tokenreviews
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-{{ .Release.Namespace }}-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-{{ .Release.Namespace }}-webhook
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-webhook
    namespace: {{ .Release.Namespace }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-webhook
spec:
  selector:
    app: {{ .Release.Name }}-webhook
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-webhook
spec:
  tls:
    - hosts:
        - {{ .Values.webhook.host | default "webhook" }}
  rules:
    - host: {{ .Values.webhook.host | default "webhook" }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-webhook
                port:
                  name: http
