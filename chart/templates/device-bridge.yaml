{{- if .Values.deviceBridge.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-devices
---
{{- if .Values.bootstrapRbac }}
{{- if eq (len .Values.deviceBridge.secretNames) 0 }}{{ fail "deviceBridge.secretNames must list at least one Secret" }}{{- end }}
# Devices live in Agent namespaces. The bridge can read only the Secret names
# explicitly allowed here, in each namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-agent-devices-auth
rules:
  - apiGroups: [codemowers.cloud]
    resources: [devices]
    verbs: [get, list, watch]
  - apiGroups: [codemowers.cloud]
    resources: [devices/status]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: {{ .Values.deviceBridge.secretNames | toJson }}
    verbs: [get]
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-agent-devices-auth
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-agent-devices-auth
subjects:
  - kind: ServiceAccount
    name: agent-devices
    namespace: {{ .Release.Namespace }}
---
# Every ServiceAccount may use the Devices MCP; Device RBAC decides each call.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-agent-devices-mcp
rules:
  - apiGroups: [codemowers.cloud]
    resources: [clustermcpservers]
    resourceNames: [devices]
    verbs: [use]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-agent-devices-mcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-agent-devices-mcp
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:serviceaccounts
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-devices
  labels:
    skaffold.dev/keep: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: agent-devices
  template:
    metadata:
      labels:
        app: agent-devices
    spec:
      serviceAccountName: agent-devices
      automountServiceAccountToken: true
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bridge
          image: {{ include "agent.image" (list . "agent-devices") }}
          imagePullPolicy: Always
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: 8080
          resources: {{ toYaml .Values.deviceBridge.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
---
apiVersion: codemowers.cloud/v1alpha1
kind: ClusterMCPServer
metadata:
  name: devices
spec:
  url: {{ printf "http://agent-devices.%s.svc.cluster.local:8080/mcp" .Release.Namespace | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: agent-devices
spec:
  selector:
    app: agent-devices
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-devices
spec:
  podSelector:
    matchLabels:
      app: agent-devices
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.operator.ingressNamespace | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
    # Workers of every Agent namespace.
    - from:
        - namespaceSelector: {}
          podSelector:
            matchExpressions:
              - key: codemowers.cloud/task
                operator: Exists
              - key: codemowers.cloud/agent
                operator: Exists
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
