apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-api
  labels:
    skaffold.dev/keep: "true"
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.operator.ingressNamespace | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
    # Workers of every Agent namespace.
    - from:
        - namespaceSelector: {}
          podSelector:
            matchExpressions:
              - key: codemowers.ai/task
                operator: Exists
              - key: codemowers.ai/agent
                operator: Exists
      ports:
        - protocol: TCP
          port: 8083
    # Prometheus scrapes the operator's metrics.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.operator.prometheusNamespace | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8081
    # Any Pod may ask to wake a Task; the endpoint authorizes each request.
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8084
