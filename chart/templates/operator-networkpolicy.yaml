apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-api
  labels:
    skaffold.dev/keep: "true"
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.operator.ingressNamespace | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - podSelector:
            matchExpressions:
              - key: codemowers.cloud/task
                operator: Exists
              - key: codemowers.cloud/agent
                operator: Exists
      ports:
        - protocol: TCP
          port: 8083
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-mailbox
spec:
  # Only workers reach the Mailbox MCP; IMAP and SMTP APIs stay on loopback.
  podSelector:
    matchLabels:
      app: agent-mailbox
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: codemowers.cloud/task
                operator: Exists
              - key: codemowers.cloud/agent
                operator: Exists
      ports:
        - protocol: TCP
          port: 8080
