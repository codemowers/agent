{{- if .Values.bootstrapRbac }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-{{ .Release.Namespace }}-operator
rules:
  # patch sets spec.suspend for dashboard users holding the suspend verb;
  # the agent-suspend admission policy below rejects any other change.
  - apiGroups: [codemowers.ai]
    resources:
      - agents
    verbs:
      - get
      - list
      - watch
      - patch
  - apiGroups: [codemowers.ai]
    resources:
      - taskpolicies
      - mailbindings
    verbs:
      - list
  - apiGroups: [codemowers.ai]
    resources:
      - mailboxes
      - clustermcpservers
      - mcpservers
    verbs:
      - get
      - list
      - watch
  - apiGroups: [codemowers.ai]
    resources:
      - tasks
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups: [codemowers.ai]
    resources:
      - agents/status
      - tasks/status
      - mailboxes/status
    verbs:
      - get
      - update
      - patch
  - apiGroups: [""]
    resources:
      - pods
      - persistentvolumeclaims
      - services
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups: [""]
    resources:
      - secrets
    resourceNames:
      - agent-operator-provider-tokens
    verbs:
      - get
  - apiGroups: [authorization.k8s.io]
    resources:
      - subjectaccessreviews
    verbs:
      - create
  - apiGroups: [authentication.k8s.io]
    resources:
      - tokenreviews
    verbs:
      - create
  - apiGroups: [rbac.authorization.k8s.io]
    resources:
      - rolebindings
    verbs:
      - get
      - delete
  - apiGroups: [coordination.k8s.io]
    resources:
      - leases
    verbs:
      - get
      - create
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-{{ .Release.Namespace }}-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-{{ .Release.Namespace }}-operator
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
---
# The operator may change only spec.suspend of an Agent; namespace
# administrators own every other field.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ .Release.Name }}-{{ .Release.Namespace }}-agent-suspend
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [codemowers.ai]
        apiVersions: ["*"]
        operations: [UPDATE]
        resources: [agents]
  matchConditions:
    - name: operator
      expression: request.userInfo.username == 'system:serviceaccount:{{ .Release.Namespace }}:{{ .Release.Name }}'
  validations:
    - message: The operator may change only spec.suspend of an Agent.
      expression: >-
          object.metadata.?labels == oldObject.metadata.?labels &&
          object.metadata.?annotations == oldObject.metadata.?annotations &&
          object.metadata.?finalizers == oldObject.metadata.?finalizers &&
          object.metadata.?ownerReferences == oldObject.metadata.?ownerReferences &&
          object.spec.?idleSeconds == oldObject.spec.?idleSeconds &&
          object.spec.?coalesceSeconds == oldObject.spec.?coalesceSeconds &&
          object.spec.?resourcePrefix == oldObject.spec.?resourcePrefix &&
          object.spec.?credentialSecretName == oldObject.spec.?credentialSecretName &&
          object.spec.?instructions == oldObject.spec.?instructions &&
          object.spec.?resources == oldObject.spec.?resources &&
          object.spec.?template == oldObject.spec.?template &&
          object.spec.?model == oldObject.spec.?model &&
          object.spec.?volumeClaimTemplates == oldObject.spec.?volumeClaimTemplates &&
          object.spec.?gitProviders == oldObject.spec.?gitProviders &&
          object.spec.?access == oldObject.spec.?access
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ .Release.Name }}-{{ .Release.Namespace }}-agent-suspend
spec:
  policyName: {{ .Release.Name }}-{{ .Release.Namespace }}-agent-suspend
  validationActions: [Deny]
---
# Leader election records an Event on its Lease in the release namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-events
rules:
  - apiGroups: ["", events.k8s.io]
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-events
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-events
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  annotations:
    kubernetes.io/description: >-
      Reconciles Agent and Task CRDs. Manages worker Pod and workspace PVC
      lifecycle with ownerReferences cascade.
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: {{ include "agent.image" (list . "agent-operator") }}
          imagePullPolicy: Always
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          ports:
            - name: api
              containerPort: 8080
            - name: agent-mcp
              containerPort: 8083
            - name: wake
              containerPort: 8084
            - name: metrics
              containerPort: 8081
            - name: healthz
              containerPort: 8082
          readinessProbe:
            httpGet:
              path: /readyz
              port: healthz
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: AGENT_DEVICES_ENABLED
              value: {{ .Values.deviceBridge.enabled | quote }}
            - name: AGENT_WEBHOOK_ENABLED
              value: {{ .Values.webhook.enabled | quote }}
            {{- if .Values.webhook.enabled }}
            - name: AGENT_WEBHOOK_ORIGIN
              value: {{ .Values.webhook.publicOrigin | quote }}
            {{- end }}
            {{- range $env, $configMap := dict "AGENT_WORKER_IMAGE" "agent-worker-image" "AGENT_MAILBOX_IMAGE" "agent-mailbox-image" }}
            - name: {{ $env }}
              valueFrom:
                configMapKeyRef:
                  name: {{ $configMap }}
                  key: image
            {{- end }}
            {{- range $name := list "OIDC_IDP_URI" "OIDC_CLIENT_ID" "OIDC_CLIENT_ORIGIN" "OIDC_REDIRECT_URIS" }}
            - name: {{ $name }}
              valueFrom:
                secretKeyRef:
                  name: oidc-client-{{ $.Release.Name }}-owner-secrets
                  key: {{ $name }}
            {{- end }}
            # Only events whose broker-verified user_id is the webhook
            # receiver's ServiceAccount are routed.
            {{- if .Values.webhook.enabled }}
            - name: AGENT_WEBHOOK_PUBLISHER
              value: system:serviceaccount:{{ .Release.Namespace }}:{{ .Release.Name }}-webhook
            {{- end }}
            - name: AMQP_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent.rabbitmq" . }}-default-user
                  key: host
            - name: AMQP_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent.rabbitmq" . }}-default-user
                  key: port
            - name: AMQP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent.rabbitmq" . }}-default-user
                  key: username
            - name: AMQP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent.rabbitmq" . }}-default-user
                  key: password
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  selector:
    app: {{ .Release.Name }}
  ports:
    - name: api
      port: 80
      targetPort: api
    - name: agent-mcp
      port: 8083
      targetPort: agent-mcp
    - name: metrics
      port: 8081
      targetPort: metrics
---
# The wake endpoint has its own Service, and so its own token audience,
# agent-operator-wake.<namespace>, distinct from the Agent MCP's.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-wake
spec:
  selector:
    app: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: wake
---
apiVersion: codemowers.cloud/v1
kind: OIDCClient
metadata:
  name: {{ .Release.Name }}
spec:
  displayName: Agent operator
  applicationType: web
  tokenEndpointAuthMethod: none
  pkce: true
  uri: {{ printf "https://%s/" .Values.operator.host | quote }}
  redirectUris:
    - {{ printf "https://%s/auth/callback" .Values.operator.host | quote }}
  allowedCORSOrigins:
    - {{ printf "https://%s" .Values.operator.host | quote }}
  allowedResources:
    - {{ required "operator.apiResource must be the public operator origin plus /api" .Values.operator.apiResource | quote }}
  grantTypes: [authorization_code, refresh_token]
  responseTypes: [code]
  availableScopes: [openid, profile, email, groups, offline_access]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
spec:
  tls:
    - hosts:
        - {{ .Values.operator.host }}
  rules:
    - host: {{ .Values.operator.host }}
      http:
        paths:
          - path: /
            pathType: Exact
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  name: api
          {{- range $path := list "/config" "/auth/callback" "/drafts.json" "/markdown.bundle.js" "/sidebar-resize.js" "/taglines.js" }}
          - path: {{ $path }}
            pathType: Exact
            backend:
              service:
                name: {{ $.Release.Name }}
                port:
                  name: api
          {{- end }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  name: api
          {{- if .Values.deviceBridge.enabled }}
          - path: /devices/
            pathType: Prefix
            backend:
              service:
                name: agent-devices
                port:
                  name: http
          {{- end }}
---
# The operator reads the images it starts from these ConfigMaps; their `image`
# key lets Skaffold rewrite them like container images.
{{- range $name := list "agent-worker" "agent-mailbox" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-image
data:
  image: {{ include "agent.image" (list $ $name) }}
---
{{- end }}
