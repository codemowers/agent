{{- if .Values.bootstrapRbac }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-{{ .Release.Namespace }}-operator
rules:
  - apiGroups: [agents.codemowers.cloud]
    resources: [agents, tasks]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [agents.codemowers.cloud]
    resources: [agents/status, tasks/status]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [pods, persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [get, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-{{ .Release.Namespace }}-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-{{ .Release.Namespace }}-operator
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-operator
    namespace: {{ .Release.Namespace }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-operator
  annotations:
    kubernetes.io/description: >-
      Reconciles Agent and Task CRDs. Manages worker Pod and workspace PVC
      lifecycle with ownerReferences cascade.
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}-operator
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-operator
    spec:
      serviceAccountName: {{ .Release.Name }}-operator
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: {{ if .Values.imageRegistry }}{{ .Values.imageRegistry }}/{{ end }}{{ .Values.operator.image }}
          imagePullPolicy: Always
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          ports:
            - name: api
              containerPort: 8080
            - name: metrics
              containerPort: 8081
            - name: healthz
              containerPort: 8082
          readinessProbe:
            httpGet:
              path: /readyz
              port: healthz
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
          env:
            - name: AGENT_WORKER_IMAGE
              value: {{ printf "%s%s" (ternary (printf "%s/" .Values.imageRegistry) "" (ne .Values.imageRegistry "")) (.Values.workerImage | default .Values.image) | quote }}
            {{- range $name := list "OIDC_IDP_URI" "OIDC_CLIENT_ID" "OIDC_CLIENT_ORIGIN" "OIDC_REDIRECT_URIS" }}
            - name: {{ $name }}
              valueFrom:
                secretKeyRef:
                  name: oidc-client-{{ $.Release.Name }}-operator-owner-secrets
                  key: {{ $name }}
            {{- end }}
            {{- if .Values.rabbitmq.enabled }}
            - name: AMQP_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-events-default-user
                  key: host
            - name: AMQP_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-events-default-user
                  key: port
            - name: AMQP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-events-default-user
                  key: username
            - name: AMQP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-events-default-user
                  key: password
            {{- end }}
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-operator
spec:
  selector:
    app: {{ .Release.Name }}-operator
  ports:
    - name: api
      port: 80
      targetPort: api
---
apiVersion: codemowers.cloud/v1
kind: OIDCClient
metadata:
  name: {{ .Release.Name }}-operator
spec:
  displayName: Agent operator
  applicationType: web
  tokenEndpointAuthMethod: none
  pkce: true
  uri: {{ printf "https://%s/" .Values.operator.host | quote }}
  redirectUris:
    - {{ printf "https://%s/auth/callback" .Values.operator.host | quote }}
  allowedCORSOrigins:
    - {{ printf "https://%s" .Values.operator.host | quote }}
  allowedResources:
    - {{ required "operator.apiResource must be the public operator origin plus /api" .Values.operator.apiResource | quote }}
  grantTypes: [authorization_code, refresh_token]
  responseTypes: [code]
  availableScopes: [openid, profile, email, groups, offline_access]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-operator
spec:
  rules:
    - host: {{ .Values.operator.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-operator
                port:
                  name: api
