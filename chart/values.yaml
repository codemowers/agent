host: "controller"
allowedGroups: []
allowedUsers: []

# bootstrapRbac: apply ServiceAccounts, Roles, ClusterRoles and bindings.
# Requires cluster-admin or namespace-admin. Set false when deploying from
# a worker pod that lacks RBAC write permissions; apply RBAC separately first.
bootstrapRbac: true

webhook:
  image: codemowers/agent-webhook:latest
  # agents: list of agent names for which to mount agent-hook-<name> secrets.
  # Each secret must have a 'token' key containing the HMAC webhook secret.
  # GitHub webhook URL: https://<webhook-host>/hooks/github/<agent-name>
  agents: []
  # host: short hostname for the webhook ingress (admission expands it).
  # Defaults to webhook.<host> if unset.
  host: ""
  resources:
    requests:
      memory: 32Mi
      cpu: 10m
    limits:
      memory: 64Mi
      cpu: 200m

operator:
  image: codemowers/agent-operator:latest
  resources:
    requests:
      memory: 64Mi
      cpu: 10m
    limits:
      memory: 128Mi
      cpu: 200m

rabbitmq:
  enabled: true
  storage: 10Gi
