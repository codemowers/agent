# Optional registry/namespace prefix without a trailing slash. Skaffold sets
# it empty so it can replace the bare image names with its builds.
imageRepository: ghcr.io/codemowers

deviceBridge:
  resources:
    requests:
      memory: 32Mi
      cpu: 10m
    limits:
      memory: 128Mi
      cpu: 200m

# bootstrapRbac: apply Roles, ClusterRoles and bindings (ServiceAccounts always exist).
# Requires cluster-admin or namespace-admin. Set false when deploying from
# a worker pod that lacks RBAC write permissions; apply RBAC separately first.
bootstrapRbac: true

webhook:
  # Full public origin displayed in the UI's webhook setup instructions.
  publicOrigin: ""
  # Space-separated CIDRs of the ingress proxies whose X-Forwarded-For is
  # trusted; needed only by receivers with githubMeta or cidrs.
  trustedProxies: ""
  # host: short hostname for the webhook ingress (admission expands it).
  host: webhook
  resources:
    requests:
      memory: 32Mi
      cpu: 10m
    limits:
      memory: 64Mi
      cpu: 200m

operator:
  # host: short hostname for the dashboard (admission expands it).
  host: dashboard
  apiResource: ""
  ingressNamespace: traefik
  resources:
    requests:
      memory: 64Mi
      cpu: 10m
    limits:
      memory: 128Mi
      cpu: 200m

rabbitmq:
  # RabbitmqCluster name, <release>-events when empty. Its topology objects are
  # named after it, so pointing this at an existing cluster adopts its queues.
  name: ""
  storage: 10Gi
  # Signing keys of the cluster's ServiceAccount issuer, which workers' broker
  # tokens are verified against. RabbitMQ requires HTTPS. EKS publishes them
  # at the public issuer's /keys URL, verified with system CAs (empty
  # jwksCACertFile); k3s serves them from the API server once anonymous
  # discovery is allowed.
  jwksURI: https://kubernetes.default.svc.cluster.local/openid/v1/jwks
  jwksCACertFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
