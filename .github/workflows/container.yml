name: Build and publish images and chart

on:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: read

jobs:
  chart-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
        with:
          version: v3.20.0
      - run: |
          helm lint chart --set operator.apiResource=https://example.test/api
          helm template agent-ci chart --set operator.apiResource=https://example.test/api > "$RUNNER_TEMP/agent.yaml"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            helm package chart --destination "$RUNNER_TEMP" \
              --version "${GITHUB_REF_NAME#v}" --app-version "$GITHUB_REF_NAME"
          else
            helm package chart --destination "$RUNNER_TEMP"
          fi

  # Each architecture builds natively. Branches only verify builds; version
  # tags publish the architecture digests used by the merge job.
  build:
    needs: chart-check
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - {name: agent-worker, context: ., file: Dockerfile, target: runner}
          - {name: agent-mailbox, context: ., file: Dockerfile, target: mailbox}
          - {name: agent-operator, context: operator, file: operator/Dockerfile}
          - {name: agent-devices, context: operator, file: operator/devicebridge/Dockerfile}
          - {name: agent-feeds, context: operator, file: operator/feeds/Dockerfile}
          - {name: agent-webhook, context: webhook, file: webhook/Dockerfile}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image.name }}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          target: ${{ matrix.image.target }}
          platforms: linux/${{ matrix.arch }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.image.name }}-${{ matrix.arch }},mode=max
      - name: Publish architecture image by digest
        if: startsWith(github.ref, 'refs/tags/v')
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          target: ${{ matrix.image.target }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.image.name }}-${{ matrix.arch }},mode=max
      - name: Save architecture digest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p digests
          printf '%s\n' "$BUILD_DIGEST" > "digests/$ARCH"
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: digest-${{ matrix.image.name }}-${{ matrix.arch }}
          path: digests/*

  merge:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [agent-worker, agent-mailbox, agent-operator, agent-devices, agent-feeds, agent-webhook]
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture image
        env:
          VERSION: ${{ github.ref_name }}
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE_NAME"
          test -s digests/amd64
          test -s digests/arm64
          for arch in amd64 arm64; do
            digest="$(cat "digests/$arch")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          done
          docker buildx imagetools create \
            -t "$image:$VERSION" -t "$image:latest" \
            "$image@$(cat digests/amd64)" "$image@$(cat digests/arm64)"
          digest="$(docker buildx imagetools inspect "$image:$VERSION" | awk '/^Digest:/ { print $2; exit }')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p release-digests
          printf '%s\n' "$digest" > "release-digests/$IMAGE_NAME"
      - uses: actions/upload-artifact@v7
        with:
          name: release-digest-${{ matrix.image }}
          path: release-digests/*

  chart:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [chart-check, merge]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-digest-*
          merge-multiple: true
          path: release-digests
      - uses: azure/setup-helm@v4
        with:
          version: v3.20.0
      - name: Package chart with immutable image digests
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          version="${VERSION#v}"
          mkdir -p "$RUNNER_TEMP/chart" "$RUNNER_TEMP/package"
          cp -R chart/. "$RUNNER_TEMP/chart/"
          grep -Fxq 'imageDigests: {}' "$RUNNER_TEMP/chart/values.yaml"
          sed -i "s|^imageRepository:.*|imageRepository: ghcr.io/$owner|" "$RUNNER_TEMP/chart/values.yaml"
          sed -i 's/^imageDigests: {}$/imageDigests:/' "$RUNNER_TEMP/chart/values.yaml"
          for image in agent-worker agent-mailbox agent-operator agent-devices agent-feeds agent-webhook; do
            digest="$(cat "release-digests/$image")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            sed -i "/^imageDigests:$/a\\  $image: $digest" "$RUNNER_TEMP/chart/values.yaml"
          done
          helm lint "$RUNNER_TEMP/chart" --set operator.apiResource=https://example.test/api
          # Optional components are off by default; render them so every
          # pinned image reference is checked.
          helm template agent-ci "$RUNNER_TEMP/chart" \
            --set operator.apiResource=https://example.test/api \
            --set deviceBridge.enabled=true --set feeds.enabled=true > "$RUNNER_TEMP/rendered.yaml"
          for image in agent-worker agent-mailbox agent-operator agent-devices agent-feeds agent-webhook; do
            digest="$(cat "release-digests/$image")"
            grep -Fq "ghcr.io/$owner/$image@$digest" "$RUNNER_TEMP/rendered.yaml"
          done
          helm package "$RUNNER_TEMP/chart" --destination "$RUNNER_TEMP/package" \
            --version "$version" --app-version "$VERSION"
      - name: Publish chart to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "$RUNNER_TEMP/package/agent-${VERSION#v}.tgz" "oci://ghcr.io/$owner/charts"
