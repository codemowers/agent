# Named Agent CR examples for codemowers-agent-system.
#
# Three privilege domains:
#   matmlazi    — developer: full toolchain, Kube RBAC, persistent workspace
#   patpalouk   — customer support: no cluster access, read-only root, no PVC
#   krtek       — admin: kubectl + helm, cluster-admin SA, persistent workspace, no webhooks
#
# Prerequisite secrets (create before applying):
#   agent-worker-anthropic-api-token  — key: token  (Claude API key)
#   agent-worker-github-token         — key: token  (GitHub PAT)
#   agent-hook-<name>                 — key: token  (webhook HMAC; see examples/webhook-secrets.yaml)
#
# Kubectl image version must match the API server:
#   kubectl version -o json | jq -r .serverVersion.gitVersion
---
apiVersion: agents.codemowers.cloud/v1alpha1
kind: Agent
metadata:
  name: matmlazi
  namespace: codemowers-agent-system
  annotations:
    codemowers.cloud/description: "Developer agent — full toolchain, Kube RBAC, topic branches"
spec:
  containers:
    - name: worker
      image: codemowers/agent:latest
      securityContext:
        readOnlyRootFilesystem: false
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 1000
      env:
        - name: PATH
          value: /opt/tools/kubectl/bin:/opt/tools/helm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: cache
          mountPath: /home/user/.cache
        - name: agent-config
          mountPath: /etc/agent
          readOnly: true
        - name: kubectl
          mountPath: /opt/tools/kubectl
          readOnly: true
        - name: helm
          mountPath: /opt/tools/helm
          readOnly: true
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: retain
        resources:
          requests:
            storage: 20Gi
    - metadata:
        name: cache
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: retain
        resources:
          requests:
            storage: 5Gi
  volumes:
    - name: agent-config
      configMap:
        name: agent-worker-config
    - name: kubectl
      image:
        reference: registry.k8s.io/kubectl:v1.36.3
        pullPolicy: IfNotPresent
    - name: helm
      image:
        reference: alpine/helm:3.17.3
        pullPolicy: IfNotPresent
  access:
    groups:
      - github.com:codemowers:admins
    subjects:
      - lauri.vosandi@gmail.com
  model:
    backend: claude
    credentialSecretRef: agent-worker-anthropic-api-token
  gitProviders:
    - type: github
      serverURL: https://github.com
      credentialSecretRef: agent-worker-github-token
  webhookSecretRef: agent-hook-matmlazi
  mcpEndpoints:
    - url: https://mcp.codemowers.io/mcp
      siteURL: https://mcp.codemowers.io
    - url: http://driftmower-mcp.driftmower.svc.cluster.local:3000/mcp
      tokenFile: /var/run/agent-mcp/driftmower
  credentialRefs:
    - agent-worker-anthropic-api-token
    - agent-worker-github-token
  workerServiceAccountName: agent-worker
---
apiVersion: agents.codemowers.cloud/v1alpha1
kind: Agent
metadata:
  name: patpalouk
  namespace: codemowers-agent-system
  annotations:
    codemowers.cloud/description: "Customer support agent — no cluster access, read-only root, no PVC"
spec:
  containers:
    - name: worker
      image: codemowers/agent:latest
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 65534
  # No volumeClaimTemplates — tasks are stateless; no PVCs created.
  access:
    groups:
      - github.com:codemowers:admins
    subjects:
      - lauri.vosandi@gmail.com
  model:
    backend: claude
    credentialSecretRef: agent-worker-anthropic-api-token
  gitProviders:
    - type: github
      serverURL: https://github.com
      credentialSecretRef: agent-worker-github-token
  webhookSecretRef: agent-hook-patpalouk
  mcpEndpoints:
    - url: https://mcp.codemowers.io/mcp
      siteURL: https://mcp.codemowers.io
  credentialRefs:
    - agent-worker-anthropic-api-token
    - agent-worker-github-token
  # No tool volumes — no kubectl, no Kubernetes API access.
  # agent-worker-readonly has automountServiceAccountToken:false and no RBAC bindings.
  workerServiceAccountName: agent-worker-readonly
---
apiVersion: agents.codemowers.cloud/v1alpha1
kind: Agent
metadata:
  name: krtek
  namespace: codemowers-agent-system
  annotations:
    codemowers.cloud/description: "Admin agent — kubectl + helm, cluster-admin SA, no GitHub webhooks"
spec:
  containers:
    - name: worker
      image: codemowers/agent:latest
      securityContext:
        readOnlyRootFilesystem: false
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 1000
      env:
        - name: PATH
          value: /opt/tools/kubectl/bin:/opt/tools/helm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: kubectl
          mountPath: /opt/tools/kubectl
          readOnly: true
        - name: helm
          mountPath: /opt/tools/helm
          readOnly: true
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: retain
        resources:
          requests:
            storage: 10Gi
  volumes:
    - name: kubectl
      image:
        reference: registry.k8s.io/kubectl:v1.36.3
        pullPolicy: IfNotPresent
    - name: helm
      image:
        reference: alpine/helm:3.17.3
        pullPolicy: IfNotPresent
  access:
    groups:
      - github.com:codemowers:admins
    subjects:
      - lauri.vosandi@gmail.com
  model:
    backend: claude
    credentialSecretRef: agent-worker-anthropic-api-token
  gitProviders:
    - type: github
      serverURL: https://github.com
      credentialSecretRef: agent-worker-github-token
  # No webhookSecretRef — triggered manually or via UI only.
  mcpEndpoints:
    - url: https://mcp.codemowers.io/mcp
      siteURL: https://mcp.codemowers.io
    - url: http://driftmower-mcp.driftmower.svc.cluster.local:3000/mcp
      tokenFile: /var/run/agent-mcp/driftmower
  credentialRefs:
    - agent-worker-anthropic-api-token
    - agent-worker-github-token
  workerServiceAccountName: agent-worker-admin
