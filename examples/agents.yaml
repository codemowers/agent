# Named Agent CR examples for codemowers-agent-system.
#
# Three privilege domains:
#   matmlazi    — developer: full toolchain, Kube RBAC, persistent workspace
#   patpalouk   — customer support: no cluster access, read-only root, no PVC
#   krtek       — admin: kubectl + helm, cluster-admin SA, persistent workspace, no webhooks
#
# Prerequisite secrets (create before applying):
#   agent-worker-anthropic-api-token  — key: token  (Claude API key)
#   agent-worker-github-token         — key: token  (GitHub PAT)
#   agent-hook-codemowers-agent      — key: token  (GitHub hook signing key)
# Replace the example hookID below with X-GitHub-Hook-ID from a delivery.
#
# Kubectl image version must match the API server:
#   kubectl version -o json | jq -r .serverVersion.gitVersion
# The operator fills an omitted worker image from the Skaffold-built runner.
---
apiVersion: agents.codemowers.cloud/v1alpha1
kind: Agent
metadata:
  name: matmlazi
  namespace: codemowers-agent-system
  annotations:
    codemowers.cloud/description: "Developer agent — full toolchain, Kube RBAC, topic branches"
spec:
  template:
    spec:
      serviceAccountName: agent-worker
      containers:
      - name: worker
        securityContext:
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
        env:
          - name: PATH
            value: /opt/tools/kubectl/bin:/opt/tools/helm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: cache
            mountPath: /home/user/.cache
          - name: agent-config
            mountPath: /etc/agent
            readOnly: true
          - name: kubectl
            mountPath: /opt/tools/kubectl
            readOnly: true
          - name: helm
            mountPath: /opt/tools/helm/bin
            subPath: usr/bin
            readOnly: true
      volumes:
        - name: agent-config
          configMap:
            name: agent-worker-config
        - name: kubectl
          image:
            reference: registry.k8s.io/kubectl:v1.36.3
            pullPolicy: IfNotPresent
        - name: helm
          image:
            reference: alpine/helm:3.17.3
            pullPolicy: IfNotPresent
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: sqlite
        resources:
          requests:
            storage: 20Gi
    - metadata:
        name: cache
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: sqlite
        resources:
          requests:
            storage: 5Gi
  model:
    backend: claude
    credentialSecretRef: agent-worker-anthropic-api-token
  gitProviders:
    - type: github
      serverURL: https://github.com
      credentialSecretRef: agent-worker-github-token
  githubWebhooks:
    - serverURL: https://github.com
      hookID: "123456"
      secretRef: agent-hook-codemowers-agent
  mcpEndpoints:
    - name: codemowers
      url: https://mcp.codemowers.io/mcp
      siteURL: https://mcp.codemowers.io
    - name: driftmower
      url: http://driftmower-mcp.driftmower.svc.cluster.local:3000/mcp
      tokenFile: /var/run/agent-mcp/driftmower
---
apiVersion: agents.codemowers.cloud/v1alpha1
kind: Agent
metadata:
  name: patpalouk
  namespace: codemowers-agent-system
  annotations:
    codemowers.cloud/description: "Customer support agent — no cluster access, read-only root, no PVC"
spec:
  template:
    spec:
      serviceAccountName: agent-worker-readonly
      securityContext:
        fsGroup: 65534
      containers:
      - name: worker
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 65534
  # No volumeClaimTemplates — tasks are stateless; no PVCs created.
  model:
    backend: claude
    credentialSecretRef: agent-worker-anthropic-api-token
  gitProviders:
    - type: github
      serverURL: https://github.com
      credentialSecretRef: agent-worker-github-token
  githubWebhooks:
    - serverURL: https://github.com
      hookID: "123456"
      secretRef: agent-hook-codemowers-agent
  mcpEndpoints:
    - name: codemowers
      url: https://mcp.codemowers.io/mcp
      siteURL: https://mcp.codemowers.io
---
apiVersion: agents.codemowers.cloud/v1alpha1
kind: Agent
metadata:
  name: krtek
  namespace: codemowers-agent-system
  annotations:
    codemowers.cloud/description: "Admin agent — kubectl + helm, cluster-admin SA, no GitHub webhooks"
spec:
  template:
    spec:
      serviceAccountName: agent-worker-admin
      containers:
      - name: worker
        securityContext:
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
        env:
          - name: PATH
            value: /opt/tools/kubectl/bin:/opt/tools/helm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: kubectl
            mountPath: /opt/tools/kubectl
            readOnly: true
          - name: helm
            mountPath: /opt/tools/helm/bin
            subPath: usr/bin
            readOnly: true
      volumes:
        - name: kubectl
          image:
            reference: registry.k8s.io/kubectl:v1.36.3
            pullPolicy: IfNotPresent
        - name: helm
          image:
            reference: alpine/helm:3.17.3
            pullPolicy: IfNotPresent
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: sqlite
        resources:
          requests:
            storage: 10Gi
  model:
    backend: claude
    credentialSecretRef: agent-worker-anthropic-api-token
  gitProviders:
    - type: github
      serverURL: https://github.com
      credentialSecretRef: agent-worker-github-token
  mcpEndpoints:
    - name: codemowers
      url: https://mcp.codemowers.io/mcp
      siteURL: https://mcp.codemowers.io
    - name: driftmower
      url: http://driftmower-mcp.driftmower.svc.cluster.local:3000/mcp
      tokenFile: /var/run/agent-mcp/driftmower
