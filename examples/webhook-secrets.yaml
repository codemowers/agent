# GitHub webhook signing Secret in the Agent's namespace.
# Each Agent references its local copy through spec.githubWebhooks[].secretRef.
# Distribute the same GitHub hook key separately to every subscribing namespace.
#
# Retrieve after creation:
#   kubectl get secret agent-hook-codemowers-agent -n codemowers-agent-system \
#     -o jsonpath='{.data.token}' | base64 -d
#
# GitHub webhook URL:
#   https://webhook.codemowers-agent-system.ee-lte-1.codemowers.io/hooks/github
---
apiVersion: secretgenerator.mittwald.de/v1alpha1
kind: StringSecret
metadata:
  name: agent-hook-codemowers-agent
  namespace: codemowers-agent-system
spec:
  forceRegenerate: false
  fields:
    - fieldName: token
      encoding: hex
      length: "32"
