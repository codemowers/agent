# Webhook HMAC secrets for GitHub/Gitea event ingestion.
# One StringSecret per agent name; the generated token key is the
# HMAC secret you paste into GitHub/Gitea webhook configuration.
#
# Retrieve after creation:
#   kubectl get secret agent-hook-<name> -n codemowers-agent-system \
#     -o jsonpath='{.data.token}' | base64 -d
#
# GitHub webhook URL pattern:
#   https://webhook.codemowers-agent-system.ee-lte-1.codemowers.io/hooks/github/<agent-name>
---
apiVersion: secretgenerator.mittwald.de/v1alpha1
kind: StringSecret
metadata:
  name: agent-hook-matmlazi
  namespace: codemowers-agent-system
spec:
  forceRegenerate: false
  fields:
    - fieldName: token
      encoding: hex
      length: "32"
---
apiVersion: secretgenerator.mittwald.de/v1alpha1
kind: StringSecret
metadata:
  name: agent-hook-patpalouk
  namespace: codemowers-agent-system
spec:
  forceRegenerate: false
  fields:
    - fieldName: token
      encoding: hex
      length: "32"
