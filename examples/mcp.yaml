# MCP server connections for workers.
# Mounted at /mcp/mcp.json in controller and worker Pods.
# Restart the controller (and active workers pick it up on next turn).
#
# The driftmower token is projected automatically; no tokenFile needed
# for the built-in driftmower entry. Remote MCPs use their own URL and
# the same projected ServiceAccount token mechanism.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-mcp
  namespace: codemowers-agent-system
data:
  mcp.json: |
    {
      "mcpServers": {
        "codemowers": {
          "type": "http",
          "url": "https://mcp.codemowers.io/mcp",
          "siteURL": "https://mcp.codemowers.io"
        },
        "driftmower": {
          "type": "http",
          "url": "http://driftmower-mcp.driftmower.svc.cluster.local:3000/mcp",
          "tokenFile": "/var/run/agent-mcp/driftmower",
          "siteURL": "https://driftmower.ee-lte-1.codemowers.io"
        }
      }
    }
