apiVersion: secretgenerator.mittwald.de/v1alpha1
kind: StringSecret
metadata:
  name: agent-device-keys
  namespace: codemowers-agent-system
spec:
  forceRegenerate: false
  fields:
    - fieldName: blueos
      encoding: hex
      length: "32"
---
apiVersion: codemowers.cloud/v1alpha1
kind: Device
metadata:
  name: blueos
  namespace: codemowers-agent-system
spec:
  displayName: BlueOS
  connectionSecretRef:
    name: agent-device-keys
    key: blueos
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-device-blueos
  namespace: codemowers-agent-system
rules:
  - apiGroups: [codemowers.cloud]
    resources: [devices]
    resourceNames: [blueos]
    verbs: [exec, read, write]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-device-blueos
  namespace: codemowers-agent-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-device-blueos
subjects:
  - kind: ServiceAccount
    name: agent-worker-matmlazi
    namespace: codemowers-agent-system
  - kind: ServiceAccount
    name: agent-worker-krtek
    namespace: codemowers-agent-system
