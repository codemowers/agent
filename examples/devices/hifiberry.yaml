apiVersion: secretgenerator.mittwald.de/v1alpha1
kind: StringSecret
metadata:
  name: agent-device-hifiberry
  namespace: agents
spec:
  forceRegenerate: false
  fields:
    - fieldName: hifiberry
      encoding: hex
      length: "32"
---
apiVersion: codemowers.ai/v1alpha1
kind: Device
metadata:
  name: hifiberry
  namespace: agents
spec:
  displayName: HiFiBerry
  connectionSecretRef:
    name: agent-device-hifiberry
    key: hifiberry
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-device-hifiberry
  namespace: agents
rules:
  - apiGroups: [codemowers.ai]
    resources: [devices]
    resourceNames: [hifiberry]
    verbs: [exec, read, write]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-device-hifiberry
  namespace: agents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-device-hifiberry
subjects:
  - kind: ServiceAccount
    name: agent-worker-matmlazi
    namespace: agents
  - kind: ServiceAccount
    name: agent-worker-krtek
    namespace: agents
