# Apply after Gitea issues laurivosandi an API token, stored as GITEA_TOKEN in
# laurivosandi-credentials, which operator.credentialSecretNames lists. The
# webhook signing key is separate.
apiVersion: codemowers.ai/v1alpha1
kind: TaskPolicy
metadata:
  name: gitea-laurivosandi-assigned
  namespace: agents
spec:
  agentRef: laurivosandi
  keyPrefix: https://git.codemowers.io
  verify: forgeAssignment
