# Events carry the sending Alertmanager's external URL as their key. A Task
# claiming that URL receives them; otherwise they reach alert-triage.
apiVersion: codemowers.ai/v1alpha1
kind: WebhookBinding
metadata:
  name: alertmanager
  namespace: agents
spec:
  receiverRef:
    kind: WebhookReceiver
    name: alertmanager
  agentRef: krtek
  routing:
    otherwise:
      taskRef: alert-triage
