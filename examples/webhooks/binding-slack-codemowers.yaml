apiVersion: codemowers.cloud/v1alpha1
kind: WebhookBinding
metadata:
  name: slack-codemowers
  namespace: agents
spec:
  protocolRef: slack-events
  agentRef: matmlazi
  match:
    teamID: T0BTAN5EF5E
  verificationKeyRef:
    name: agent-operator-webhook-keys
    key: slack-codemowers
  routing:
    otherwise:
      taskRef: communications
