# Events of the codemowers org from the shared GitHub hook. A narrower prefix
# such as https://github.com/codemowers/agent selects one repository.
apiVersion: codemowers.ai/v1alpha1
kind: WebhookBinding
metadata:
  name: github-codemowers-agent
  namespace: agents
spec:
  receiverRef:
    kind: ClusterWebhookReceiver
    name: github
  agentRef: matmlazi
  keyPrefixes:
    - https://github.com/codemowers
