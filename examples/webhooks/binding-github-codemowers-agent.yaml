# Public GitHub and GHES can send to /hooks/github. Each may instead use its
# namespaced URL, such as /hooks/agents/github-codemowers-agent. Their
# server URL, hook ID, and signing key remain distinct binding settings.
apiVersion: codemowers.cloud/v1alpha1
kind: WebhookBinding
metadata:
  name: github-codemowers-agent
  namespace: agents
spec:
  protocolRef: github
  agentRef: matmlazi
  match:
    serverURL: https://github.com
    hookID: '698893022'
  verificationKeyRef:
    name: agent-operator-webhook-keys
    key: github-public
