apiVersion: codemowers.ai/v1alpha1
kind: WebhookProtocol
metadata:
  name: slack-events
spec:
  signature:
    algorithm: hmacSha256
    keyEncoding: utf8
    header: x-slack-signature
    prefix: v0=
    encoding: hex
    signedBytesCEL: "bytes('v0:' + headers['x-slack-request-timestamp'] + ':') + rawBody"
    freshness:
      timestampHeader: x-slack-request-timestamp
      maxSkew: 5m
  event:
    # Thread permalinks without the workspace host; channel IDs are unique.
    allowedKeyPrefixes:
      - https://slack.com/archives
    requiredHeaders:
      - x-slack-signature
      - x-slack-request-timestamp
    acceptCEL: "body.type == 'url_verification' || body.team_id == receiver.match.teamID"
    eventsCEL: >-
      body.type == 'event_callback' && has(body.event) &&
      !has(body.event.bot_id) &&
      (!has(body.event.subtype) || body.event.subtype != 'bot_message') ? [{
        'deliveryID': body.event_id,
        'type': body.event.type,
        'actor': has(body.event.user) ? body.event.user : 'Slack',
        'text': has(body.event.text) ? body.event.text : body.event.type,
        'key': has(body.event.channel) && has(body.event.ts) ?
          'https://slack.com/archives/' + body.event.channel + '/p' +
          (has(body.event.thread_ts) ? body.event.thread_ts : body.event.ts).replace('.', '') : ''
      }] : []
  response:
    rules:
      - whenCEL: "body.type == 'url_verification'"
        status: 200
        contentType: text/plain
        bodyCEL: body.challenge
    defaultStatus: 200
