# One event per Alertmanager notification; Alertmanager already groups alerts.
# A retried notification has the same body and therefore the same deliveryID.
# The key is the sending Alertmanager's external URL. Alertmanager signs
# nothing; its receiver authenticates it by a projected ServiceAccount token.
apiVersion: codemowers.ai/v1alpha1
kind: WebhookProtocol
metadata:
  name: alertmanager
spec:
  event:
    allowedKeyPrefixes:
      - https://alertmanager.example.test
    eventsCEL: >-
      [{
        'deliveryID': sha256Hex(rawBody),
        'type': body.status,
        'actor': 'Alertmanager',
        'text': '[' + body.status + ':' + string(size(body.alerts)) + '] ' +
          (has(body.commonLabels.alertname) ? body.commonLabels.alertname : 'alerts') +
          (has(body.commonAnnotations.summary) ?
            ': ' + body.commonAnnotations.summary : ''),
        'url': has(body.externalURL) ? body.externalURL : '',
        'key': body.externalURL
      }]
  response:
    status: 202
