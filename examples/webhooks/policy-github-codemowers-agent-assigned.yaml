# Task creation is a separate authorization decision. A valid webhook alone
# cannot create a Task; forgeAssignment checks the configured Agent's
# forge account and the current issue or PR assignment before creation.
apiVersion: codemowers.cloud/v1alpha1
kind: TaskPolicy
metadata:
  name: github-codemowers-agent-assigned
  namespace: agents
spec:
  agentRef: matmlazi
  keyPrefix: https://github.com
  verify: forgeAssignment
