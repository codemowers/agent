# Optional Gitea.com template. Supply a real signing key before applying.
# The namespaced path is /hooks/codemowers-agent-system/gitea-public.
apiVersion: codemowers.cloud/v1alpha1
kind: WebhookReceiver
metadata:
  name: gitea-public
  namespace: codemowers-agent-system
spec:
  sourceRef:
    kind: ClusterWebhookReceiver
    name: gitea
  agentRef: matmlazi
  match:
    serverURL: https://gitea.com
  verificationKeyRef:
    name: agent-operator-webhook-keys
    key: gitea-public
  routing:
    existingTask: exactKey
    otherwise:
      taskRef: webhook-triage
