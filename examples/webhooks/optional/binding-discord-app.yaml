# The key named discord-public-key is an Ed25519 public key in hex form.
apiVersion: codemowers.cloud/v1alpha1
kind: WebhookBinding
metadata:
  name: discord-app
  namespace: agents
spec:
  protocolRef: discord-events
  agentRef: matmlazi
  match:
    applicationID: "123456789012345678"
  verificationKeyRef:
    name: agent-operator-webhook-keys
    key: discord-public-key
  routing:
    otherwise:
      taskRef: communications
