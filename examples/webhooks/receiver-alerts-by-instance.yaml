# Alerts for this instance can be claimed by a Task with
# [internal, alertmanager, <instanceID>]. Set instanceID to this cluster's
# name. Other alerts reach alert-triage.
# Use only the internal
# webhook Service and an ingress policy restricted to Alertmanager Pods.
# Alert labels select only among Tasks already bound to this Agent.
apiVersion: codemowers.cloud/v1alpha1
kind: WebhookReceiver
metadata:
  name: alerts-by-instance
  namespace: codemowers-agent-system
spec:
  sourceRef:
    kind: ClusterWebhookReceiver
    name: alertmanager
  agentRef: matmlazi
  match:
    instanceID: example-cluster
  routing:
    keyCEL: "['alertmanager', binding.match.instanceID]"
    existingTask: exactKey
    otherwise:
      taskRef: alert-triage
    coalesceFor: 2m
