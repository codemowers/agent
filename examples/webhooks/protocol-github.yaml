apiVersion: codemowers.ai/v1alpha1
kind: WebhookProtocol
metadata:
  name: github
spec:
  signature:
    algorithm: hmacSha256
    keyEncoding: utf8
    header: x-hub-signature-256
    prefix: sha256=
    encoding: hex
    signedBytesCEL: rawBody
  event:
    # Add each GitHub Enterprise host whose bindings use this protocol.
    allowedKeyPrefixes:
      - https://github.com
    requiredHeaders:
      - x-github-delivery
      - x-github-event
    acceptCEL: >-
      headers['x-github-event'] == 'ping' || !has(body.repository) ||
      (has(body.repository.html_url) &&
       urlHost(body.repository.html_url) == urlHost(receiver.match.serverURL))
    eventsCEL: >-
      headers['x-github-event'] == 'ping' ? [] : [{
        'deliveryID': headers['x-github-delivery'],
        'type': headers['x-github-event'] + (has(body.action) ? '.' + body.action : ''),
        'actor': has(body.sender) && has(body.sender.login) ? body.sender.login : 'GitHub',
        'text': has(body.comment) && has(body.comment.body) ? body.comment.body :
          has(body.review) && has(body.review.body) ? body.review.body :
          has(body.issue) && has(body.issue.title) ? body.issue.title :
          has(body.pull_request) && has(body.pull_request.title) ? body.pull_request.title :
          headers['x-github-event'],
        'url': has(body.comment) && has(body.comment.html_url) ? body.comment.html_url :
          has(body.review) && has(body.review.html_url) ? body.review.html_url :
          has(body.pull_request) && has(body.pull_request.html_url) ? body.pull_request.html_url :
          has(body.issue) && has(body.issue.html_url) ? body.issue.html_url :
          has(body.repository) && has(body.repository.html_url) ? body.repository.html_url : '',
        'key': has(body.repository) && (has(body.issue) || has(body.pull_request)) ?
          receiver.match.serverURL + '/' + body.repository.full_name.lowerAscii() + '/issues/' +
          string(has(body.issue) ? body.issue.number : body.pull_request.number) :
          has(body.repository) && has(body.repository.full_name) ?
          receiver.match.serverURL + '/' + body.repository.full_name.lowerAscii() : ''
      }]
  response:
    status: 202
