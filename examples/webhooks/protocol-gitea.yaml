apiVersion: codemowers.ai/v1alpha1
kind: WebhookProtocol
metadata:
  name: gitea
spec:
  signature:
    algorithm: hmacSha256
    keyEncoding: utf8
    header: x-gitea-signature
    encoding: hex
    signedBytesCEL: rawBody
  event:
    allowedKeyPrefixes:
      - https://git.codemowers.io
      - https://gitea.com
    requiredHeaders:
      - x-gitea-delivery
      - x-gitea-event
    acceptCEL: >-
      !has(body.repository) ||
      (has(body.repository.html_url) &&
       urlHost(body.repository.html_url) == urlHost(receiver.match.serverURL))
    eventsCEL: >-
      headers['x-gitea-event'] == 'ping' ? [] : [{
        'deliveryID': headers['x-gitea-delivery'],
        'type': (headers['x-gitea-event-type'] != '' ?
          headers['x-gitea-event-type'] : headers['x-gitea-event']) +
          (has(body.action) ? '.' + body.action : ''),
        'actor': has(body.sender) && has(body.sender.login) ? body.sender.login :
          has(body.sender) && has(body.sender.username) ? body.sender.username : 'Gitea',
        'text': (has(body.issue) && body.issue != null && has(body.issue.title) ?
          'Original post: ' + body.issue.title + '\n' +
          (has(body.issue.body) && body.issue.body != null ? body.issue.body : '') :
          has(body.pull_request) && body.pull_request != null && has(body.pull_request.title) ?
          'Original post: ' + body.pull_request.title + '\n' +
          (has(body.pull_request.body) && body.pull_request.body != null ? body.pull_request.body : '') :
          headers['x-gitea-event']) +
          (has(body.comment) && body.comment != null && has(body.comment.body) &&
           body.comment.body != null ? '\n\nComment:\n' + body.comment.body : ''),
        'url': has(body.comment) && has(body.comment.html_url) ? body.comment.html_url :
          has(body.pull_request) && body.pull_request != null &&
            has(body.pull_request.html_url) ? body.pull_request.html_url :
          has(body.issue) && has(body.issue.html_url) ? body.issue.html_url :
          has(body.repository) && has(body.repository.html_url) ? body.repository.html_url : '',
        'key': has(body.repository) && (has(body.issue) || has(body.pull_request)) ?
          receiver.match.serverURL + '/' + body.repository.full_name.lowerAscii() + '/issues/' +
          string(has(body.issue) ? body.issue.number : body.pull_request.number) :
          has(body.repository) && has(body.repository.full_name) ?
          receiver.match.serverURL + '/' + body.repository.full_name.lowerAscii() : ''
      }]
  response:
    status: 202
