apiVersion: codemowers.cloud/v1alpha1
kind: WebhookBinding
metadata:
  name: gitea-laurivosandi
  namespace: agents
spec:
  receiverRef:
    kind: ClusterWebhookReceiver
    name: gitea-laurivosandi
  agentRef: laurivosandi
  keyPrefixes:
    - https://git.codemowers.io/laurivosandi
  routing:
    otherwise:
      taskRef: laurivosandi-gitea-intake
