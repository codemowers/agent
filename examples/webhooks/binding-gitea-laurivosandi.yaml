apiVersion: codemowers.cloud/v1alpha1
kind: WebhookBinding
metadata:
  name: gitea-laurivosandi
  namespace: agents
spec:
  protocolRef: gitea
  agentRef: laurivosandi
  match:
    serverURL: https://git.codemowers.io
  verificationKeyRef:
    name: agent-operator-webhook-keys
    key: gitea-laurivosandi
  routing:
    otherwise:
      taskRef: laurivosandi-gitea-intake
