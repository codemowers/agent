apiVersion: codemowers.ai/v1alpha1
kind: Agent
metadata:
  name: laurivosandi
  namespace: agents
  annotations:
    kubernetes.io/description: "Agent for laurivosandi; no Kubernetes API access"
spec:
  # Only these dashboard users may read and prompt this Agent's Tasks.
  access:
    users: [laurivosandi]
  idleSeconds: 3600
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2Gi
  template:
    spec:
      serviceAccountName: agent-worker-laurivosandi
      containers:
      - name: worker
        securityContext:
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: cache
            mountPath: /home/user/.cache
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: sqlite
        resources:
          requests:
            storage: 20Gi
    - metadata:
        name: cache
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: sqlite
        resources:
          requests:
            storage: 5Gi
  model:
    backend: claude
    credentialKeyRef: anthropic
  gitProviders:
    - type: github
      serverURL: https://github.com
      credentialKeyRef: laurivosandi-github
    - type: gitea
      serverURL: https://git.codemowers.io
      credentialKeyRef: laurivosandi-gitea
