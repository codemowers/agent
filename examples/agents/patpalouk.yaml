apiVersion: codemowers.cloud/v1alpha1
kind: Agent
metadata:
  name: patpalouk
  namespace: agents
  annotations:
    kubernetes.io/description: "Customer support agent — no cluster access, read-only root, no PVC"
spec:
  # Only these dashboard users may read and prompt this Agent's Tasks.
  access:
    users: [laurivosandi]
  template:
    spec:
      serviceAccountName: agent-worker-patpalouk
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65534
      containers:
      - name: worker
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 65534
        env:
          # Mat's Slack user token; Pat reads and posts as Mat.
          - name: SLACK_TOKEN
            valueFrom:
              secretKeyRef:
                name: mat-slack-token
                key: user-token
  # No volumeClaimTemplates — tasks are stateless; no PVCs created.
  model:
    backend: claude
    credentialKeyRef: anthropic
  gitProviders:
    - type: github
      serverURL: https://github.com
      credentialKeyRef: github
  mcpEndpoints:
    - name: codemowers
      url: https://mcp.codemowers.io/mcp
      siteURL: https://mcp.codemowers.io
