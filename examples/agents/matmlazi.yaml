apiVersion: codemowers.ai/v1alpha1
kind: Agent
metadata:
  name: matmlazi
  namespace: agents
  annotations:
    kubernetes.io/description: "Developer agent — full toolchain, Kube RBAC, topic branches"
spec:
  # Only these dashboard users may read and prompt this Agent's Tasks.
  access:
    users: [laurivosandi]
  idleSeconds: 3600
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2Gi
  template:
    spec:
      serviceAccountName: agent-worker-matmlazi
      containers:
      - name: worker
        securityContext:
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
        env:
          - name: PATH
            value: /opt/tools/kubectl/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          # The push Secret lives in the workload namespace demo, not in the
          # worker's own namespace.
          - name: SKAFFOLD_DEFAULT_REPO
            value: zot.registry.ee-lte-1.codemowers.io/matmlazi
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: cache
            mountPath: /home/user/.cache
          - name: kubectl
            mountPath: /opt/tools/kubectl
            readOnly: true
      volumes:
        - name: kubectl
          image:
            reference: registry.k8s.io/kubectl
            pullPolicy: IfNotPresent
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: sqlite
        resources:
          requests:
            storage: 20Gi
    - metadata:
        name: cache
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: sqlite
        resources:
          requests:
            storage: 5Gi
  model:
    backend: claude
    credentialKeyRef: anthropic
  gitProviders:
    - type: github
      serverURL: https://github.com
      credentialKeyRef: github
    - type: gitea
      serverURL: https://git.codemowers.io
      credentialKeyRef: matmlazi-gitea
