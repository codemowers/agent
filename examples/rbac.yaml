# RBAC for the Agents. Agents and their workers share the namespace agents;
# the harness stays in codemowers-agent-system. matmlazi deploys into the
# workload namespace demo;
# workers discover writable namespaces through the Driftmower MCP, so further
# RoleBindings need no Agent change.
#
# agent-operator-manager ClusterRole — grants manage access to Agent and Task CRs.
# Bind this role to users/groups in each namespace. The operator checks each
# caller's Agent get permission with a SubjectAccessReview; spec.access is ignored.
#
# Worker ServiceAccounts:
# One ServiceAccount per Agent, named agent-worker-<Agent>:
#   agent-worker-matmlazi     (developer): namespaced workloads + platform CRDs
#   agent-worker-laurivosandi: no Kubernetes API token; see agents/laurivosandi-rbac.yaml
#   agent-worker-patpalouk    (support): no Kubernetes API token
#   agent-worker-krtek        (admin): ClusterRoleBinding to cluster-admin
#
# Apply: kubectl apply -f examples/rbac.yaml
---
# ── agent-operator-manager: ClusterRole for Agent/Task CR management ──────────────────
# Grants get/list/watch/update/patch/delete on Agent and Task CRs.
# Namespaced access is scoped by administrator-managed RoleBindings.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-operator-manager
rules:
  - apiGroups: [codemowers.ai]
    resources: [agents, tasks]
    verbs: [get, list, watch, update, patch, delete]
  - apiGroups: [codemowers.ai]
    resources: [agents/status, tasks/status]
    verbs: [get]
---
# ── matmlazi: developer SA ────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-worker-matmlazi
  namespace: agents
---
# Developer gets full control over approved namespaced resources in each
# namespace it is bound in, but no Secrets. ClusterRole so it can be bound in
# several workload namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-worker-developer
rules:
  # Core workload types
  - apiGroups: [""]
    resources: [pods, services, configmaps, persistentvolumeclaims,
                serviceaccounts, events]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, update, patch, delete]
  # Platform CRDs — OIDC, object storage, databases, caches, messaging
  - apiGroups: [codemowers.ai]
    resources: [oidcclients]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [traefik.io]
    resources: [serverstransports]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [s3.onyxia.sh]
    resources: [buckets, paths, policies, s3users]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [postgresql.cnpg.io]
    resources: ["*"]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [dragonflydb.io]
    resources: ["*"]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [rabbitmq.com]
    resources: ["*"]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [cluster.redpanda.com]
    resources: ["*"]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [opensearch.opster.io]
    resources: ["*"]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps.emqx.io]
    resources: ["*"]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [mongodbcommunity.mongodb.com]
    resources: ["*"]
    verbs: [get, list, watch, create, update, patch, delete]
  # Certificates and secrets (generated by cert-manager / secretgenerator)
  - apiGroups: [cert-manager.io]
    resources: [certificates, issuers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [secretgenerator.mittwald.de]
    resources: [stringsecrets]
    verbs: [get, list, watch, create, update, patch, delete]
  # Cluster reads — operational visibility only, no mutations
  - apiGroups: [""]
    resources: [nodes, namespaces, resourcequotas]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  # Skaffold Kaniko builds
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-worker-matmlazi-developer
  namespace: demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-worker-developer
subjects:
  - kind: ServiceAccount
    name: agent-worker-matmlazi
    namespace: agents
---
# Skaffold checks that the Kaniko push Secret exists before mounting it in the
# builder Pod; the kubelet mounts it without further RBAC.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-worker-kaniko-push
  namespace: demo
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [zot-registry-cluster-push-kaniko]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-worker-matmlazi-kaniko-push
  namespace: demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-worker-kaniko-push
subjects:
  - kind: ServiceAccount
    name: agent-worker-matmlazi
    namespace: agents
---
# ── patpalouk: customer support SA ───────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-worker-patpalouk
  namespace: agents
  annotations:
    kubernetes.io/description: "No Kubernetes API access; token mount disabled."
# Disable automatic SA token projection — pod gets no in-cluster credentials.
automountServiceAccountToken: false
# No RoleBinding or ClusterRoleBinding intentionally.
# The worker image communicates with GitHub and external services only.
---
# ── krtek: admin SA ──────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-worker-krtek
  namespace: agents
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-worker-krtek-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: agent-worker-krtek
    namespace: agents
