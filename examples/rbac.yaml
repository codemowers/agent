# Worker ServiceAccounts and RBAC for the three named agents.
#
# matmlazi (developer)
#   SA: agent-worker
#   Access: namespaced workloads + platform CRDs in codemowers-agent-system
#
# patpalouk (customer support)
#   SA: agent-worker-readonly
#   Access: none — automountServiceAccountToken disabled, no bindings
#
# krtek (admin)
#   SA: agent-worker-admin
#   Access: cluster-admin ClusterRoleBinding
#
# Apply: kubectl apply -f examples/rbac.yaml -n codemowers-agent-system
---
# ── matmlazi: developer SA ────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-worker
  namespace: codemowers-agent-system
---
# Developer gets full control over approved namespaced resources in their
# own namespace. ClusterRole so it can be reused across namespaces later.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-worker-developer
rules:
  # Core workload types
  - apiGroups: [""]
    resources: [pods, services, configmaps, secrets, persistentvolumeclaims,
                serviceaccounts, events]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, update, patch, delete]
  # Platform CRDs — OIDC, object storage, databases, caches, messaging
  - apiGroups: [oidc.codemowers.cloud]
    resources: ["*"]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [s3.codemowers.cloud]
    resources: ["*"]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [postgresql.cnpg.io]
    resources: ["*"]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [dragonflydb.io]
    resources: ["*"]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [rabbitmq.com]
    resources: ["*"]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [redpanda.vectorized.io]
    resources: ["*"]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [opensearch.opster.io]
    resources: ["*"]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [emqx.io]
    resources: ["*"]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [mongodbcommunity.mongodb.com]
    resources: ["*"]
    verbs: [get, list, watch, create, update, patch, delete]
  # Certificates and secrets (generated by cert-manager / secretgenerator)
  - apiGroups: [cert-manager.io]
    resources: [certificates, issuers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [secretgenerator.mittwald.de]
    resources: [stringsecrets]
    verbs: [get, list, watch, create, update, patch, delete]
  # Cluster reads — operational visibility only, no mutations
  - apiGroups: [""]
    resources: [nodes, namespaces, resourcequotas]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  # Skaffold Kaniko builds
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-worker-developer
  namespace: codemowers-agent-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-worker-developer
subjects:
  - kind: ServiceAccount
    name: agent-worker
    namespace: codemowers-agent-system
---
# ── patpalouk: customer support SA ───────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-worker-readonly
  namespace: codemowers-agent-system
  annotations:
    codemowers.cloud/description: "No Kubernetes API access; token mount disabled."
# Disable automatic SA token projection — pod gets no in-cluster credentials.
automountServiceAccountToken: false
# No RoleBinding or ClusterRoleBinding intentionally.
# The worker image communicates with GitHub and external services only.
---
# ── krtek: admin SA ──────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-worker-admin
  namespace: codemowers-agent-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-worker-admin-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: agent-worker-admin
    namespace: codemowers-agent-system
