# Mailbox Pods run as agent-mailbox. Only their mcp container receives its
# token, which may only review worker tokens and their access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-mailbox
  namespace: agents
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agents-agent-mailbox-auth
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: agent-mailbox
    namespace: agents
---
# send permits send_email; read permits listing and reading messages in every folder.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mailbox-matmlazi-mail
  namespace: agents
rules:
  - apiGroups: [codemowers.cloud]
    resources: [mailboxes]
    resourceNames: [matmlazi-mail]
    verbs: [send, read]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mailbox-matmlazi-mail
  namespace: agents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mailbox-matmlazi-mail
subjects:
  - kind: ServiceAccount
    name: agent-worker-matmlazi
    namespace: agents
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mailbox-patpalouk-mail
  namespace: agents
rules:
  - apiGroups: [codemowers.cloud]
    resources: [mailboxes]
    resourceNames: [patpalouk-mail]
    verbs: [send, read]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mailbox-patpalouk-mail
  namespace: agents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mailbox-patpalouk-mail
subjects:
  - kind: ServiceAccount
    name: agent-worker-patpalouk
    namespace: agents
