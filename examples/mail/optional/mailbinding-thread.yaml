# Draft generic mail thread binding; no forge-specific parsing is needed.
apiVersion: codemowers.cloud/v1alpha1
kind: MailBinding
metadata:
  name: support-threads
  namespace: example
spec:
  mailboxRef: support
  agentRef: support
  match:
    exceptFromAddresses: [support@example.test]
    headers:
      - name: Message-ID
        pattern: '^<[^<>]+>$'
  event:
    type: mail_message
    actor: '${mail.fromAddress}'
    text: New mail in support thread
    key: 'mid:${mail.threadRootMessageID}'
