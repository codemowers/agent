# API tokens for worker Pods. Create with actual values before deploying.
# These are referenced by name in the controller; the controller does
# not need to restart when token values rotate (Pods read at creation).
#
# GitHub token (for issue/PR routing, Git operations and gh CLI in workers):
#   kubectl create secret generic agent-worker-github-token \
#     --from-literal=token=ghp_... \
#     -n codemowers-agent-system
#
# Anthropic API key (for Claude workers):
#   kubectl create secret generic agent-worker-anthropic-api-token \
#     --from-literal=token=sk-ant-... \
#     -n codemowers-agent-system
#
# OpenAI API key (for Codex workers):
#   kubectl create secret generic agent-worker-openai-api-token \
#     --from-literal=token=sk-... \
#     -n codemowers-agent-system
#
# Shown as YAML for review; use kubectl create secret to avoid storing
# plaintext tokens in this file or in git.
---
# apiVersion: v1
# kind: Secret
# metadata:
#   name: agent-worker-github-token
#   namespace: codemowers-agent-system
# stringData:
#   token: "ghp_REPLACE_ME"
---
# apiVersion: v1
# kind: Secret
# metadata:
#   name: agent-worker-anthropic-api-token
#   namespace: codemowers-agent-system
# stringData:
#   token: "sk-ant-REPLACE_ME"
---
# apiVersion: v1
# kind: Secret
# metadata:
#   name: agent-worker-openai-api-token
#   namespace: codemowers-agent-system
# stringData:
#   token: "sk-REPLACE_ME"
